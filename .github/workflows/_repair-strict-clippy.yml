name: Guarded strict clippy repair

on:
  push:
    paths:
      - .github/workflows/_repair-strict-clippy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            actual="$(git hash-object "$1")"
            if [ "$actual" != "$2" ]; then
              echo "blob mismatch: $1 expected $2 got $actual" >&2
              exit 1
            fi
          }
          check_blob src/simd_report.rs 21faaf8a50fd23b6653d134d6c53e4a39447dc4d
          check_blob src/wasm/aggregate/function_value.rs d93e3109f420ae2e0579a815edd7a524117f0c30
          check_blob src/wasm/aggregate.rs 959b98ba7d65518cdaf031b86c15af4f6a76fa46
          check_blob src/source_verify/function_value_inventory.rs 7db4f19c544664349a32f78438e3b96b03f5651f

      - name: Apply exact clippy fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"patch anchor count for {path} is {count}, expected 1")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/simd_report.rs",
              "/// carry the same explicit suffixes as the canonical formatter.\n\nimpl Walker<'_> {",
              "/// carry the same explicit suffixes as the canonical formatter.\nimpl Walker<'_> {",
          )

          replace_once(
              "src/wasm/aggregate/function_value.rs",
              "pub(super) fn execution_target<'a>(target: &'a ResolvedFunction) -> FunctionExecutionId {",
              "pub(super) fn execution_target(target: &ResolvedFunction) -> FunctionExecutionId {",
          )

          old = "\n".join([
              "        let table = *self",
              "            .function_tables",
              "            .get(target)",
              "            .ok_or_else(|| error(\"function reference has no aggregate WebAssembly table slot\"))?;",
              "        self.output.push(0x41);",
              "        super::write_i64(",
              "            self.output,",
              "            i64::try_from(table).map_err(|_| error(\"function table index exceeds signed i32\"))?,",
              "        );",
          ])
          new = "\n".join([
              "        let table = *self",
              "            .function_tables",
              "            .get(target)",
              "            .ok_or_else(|| error(\"function reference has no aggregate WebAssembly table slot\"))?;",
              "        let table =",
              "            i32::try_from(table).map_err(|_| error(\"function table index exceeds signed i32\"))?;",
              "        self.output.push(0x41);",
              "        super::write_i64(self.output, i64::from(table));",
          ])
          replace_once("src/wasm/aggregate/function_value.rs", old, new)

          replace_once(
              "src/wasm/aggregate.rs",
              "fn emit_function(\n    program: &ResolvedProgram,",
              "#[allow(clippy::too_many_arguments)]\nfn emit_function(\n    program: &ResolvedProgram,",
          )

          old = "\n".join([
              "    functions",
              "        .iter()",
              "        .filter_map(|(name, function)| {",
              "            (universe.contains(*name)",
              "                && function_value_signature(function).as_ref() == Some(signature))",
              "            .then(|| (*name).to_owned())",
              "        })",
              "        .collect()",
          ])
          new = "\n".join([
              "    functions",
              "        .iter()",
              "        .filter(|(name, function)| {",
              "            universe.contains(**name)",
              "                && function_value_signature(**function).as_ref() == Some(signature)",
              "        })",
              "        .map(|(name, _)| (*name).to_owned())",
              "        .collect()",
          ])
          replace_once("src/source_verify/function_value_inventory.rs", old, new)
          PY

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify strict clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Commit guarded repair and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved during guarded repair; refusing to push" >&2
            exit 1
          fi
          git rm .github/workflows/_repair-strict-clippy.yml
          git config user.name "Riedl Kevin, Bsc."
          git config user.email "kevin.riedl.privat@gmail.com"
          git add src/simd_report.rs src/wasm/aggregate/function_value.rs src/wasm/aggregate.rs src/source_verify/function_value_inventory.rs
          git diff --cached --check
          git commit -m "fix: satisfy strict clippy after function values"
          git push origin HEAD:main

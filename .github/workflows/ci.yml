              print("DONE", i, row, flush=True)
              if result.returncode or row.get("zero_selected_error") or row.get("selected_count_mismatch"):
                  print(data.decode(errors="replace")[-4000:], flush=True)
              if b"could not compile" in data or b"error[E" in data:
                  if harness_key is None:
                      break
                  failed_harnesses[harness_key] = log.name
          if graph_wire_pin_failed:
              command = ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib",
                         "workspace_graph::type_proof_tests::projection_tests::emit_projection_wire_pin_candidate",
                         "--", "--ignored", "--nocapture", "--test-threads=1"]
              log = out / "graph-wire-candidate-producer.log"
              print("START conditional owning graph-wire candidate producer", flush=True)
              with log.open("wb") as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              selected = sum(map(int, re.findall(rb"test result: ok\. ([0-9]+) passed", data))) if result.returncode == 0 else 0
              rows.append({"command": command, "exit_code": result.returncode, "selected_passed": selected,
                           "expected_selected": 1, "selected_count_mismatch": selected != 1,
                           "log_sha256": hashlib.sha256(data).hexdigest(), "conditional_on_wire_pin_failure": True})
              (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
          # The candidate producer is evidence only and can never convert a failed literal pin into success.
          failed = required_failures or len(rows) < len(commands)
          generated = subprocess.run(["git", "diff", "--exit-code", "--", *pin_paths], capture_output=True)
          if generated.returncode:
              failed = True
              (out / "generated-source-diff.log").write_bytes(generated.stdout + generated.stderr)
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required_passed={'false' if failed else 'true'}\n")
          sys.exit(int(failed))
          PYCODE
      - name: Offline 49-case qualification of both original matcher adapters
        if: steps.focused.outputs.required_passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQUAL'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, sys, tempfile, time
          root = Path.cwd().resolve(); out = Path("focused-evidence"); out.mkdir(exist_ok=True)
          compiler = root / "target/opt-focused-706-709/debug/semaprax"
          sys.path.insert(0, str(root / "benchmarks/cli-tokens-v1"))
          import live_campaign
          settings = {"round": 6, "qualification": live_campaign.qualification.metadata(),
                      "seed_files_sha256": live_campaign.ROUND_SEED_SHA256[6]}
          live_campaign.qualification.require_settings(settings)
          env = live_campaign.trial_environment(compiler); env["SEMAPRAX_BIN"] = str(compiler)
          node = subprocess.check_output(["node", "--version"], text=True, env=env).strip()
          assert node == "v24.3.0", node
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          inventory = lambda d: {str(p.relative_to(d)): sha(p) for p in sorted(d.rglob("*")) if p.is_file()}
          compiler_before = sha(compiler); rows = []
          for variant in ("matcher-adapted", "matcher-package-adapted"):
              source = root / "experiments/ascii-pattern-source/loglens-reference" / variant
              assert not any(p.is_symlink() for p in source.rglob("*"))
              candidate = Path(tempfile.mkdtemp(prefix="spx-loglens-", dir=os.environ["RUNNER_TEMP"])).resolve() / "candidate"
              shutil.copytree(source, candidate); source_files = inventory(source)
              assert inventory(candidate) == source_files
              sample = root / "benchmarks/cli-tokens-v1/sample.log"
              shutil.copy2(sample, candidate.parent / "sample.log"); assert sha(candidate.parent / "sample.log") == sha(sample)
              evidence = out / variant; assert not evidence.exists(), "qualification evidence must be fresh"
              started = time.monotonic()
              result = live_campaign.check_program_for_campaign(candidate, 240, env, settings, "semaprax", evidence)
              row = {"variant": variant, "source_files_sha256": source_files,
                     "sibling_sample_sha256": sha(sample), "compiler_sha256": compiler_before,
                     "source_subject": os.environ["SOURCE_SUBJECT"],
                     "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                     "node_version": node, "seconds": round(time.monotonic() - started, 3),
                     "qualification_result": result, "model_dispatch": "none"}
              if (candidate / "loglens").is_file(): row["native_binary_sha256"] = sha(candidate / "loglens")
              (out / f"{variant}-receipt.json").write_text(json.dumps(row, indent=2) + "\n")
              rows.append(row); print(json.dumps(row, indent=2), flush=True)
              assert sha(compiler) == compiler_before, "compiler changed during qualification"
              shutil.rmtree(candidate.parent)
          (out / "adapter-results.json").write_text(json.dumps(rows, indent=2) + "\n")
          sys.exit(0 if all(row["qualification_result"].get("accepted") is True for row in rows) else 1)
          PYQUAL
      - name: Preserve focused verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opt-focused-next-batch
          path: focused-evidence/
          retention-days: 7
      - name: Save private hosted Cargo intermediates
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/opt-focused-706-709
          key: opt-focused-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}

  macos-compiler:
    if: ${{ inputs.profile == 'macos-compiler' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE_SUBJECT: ${{ inputs.source_subject }} # exact joined source c927d848a1e5ae7a51a57ef2ff8a1bdeab24c6ab
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      WORKFLOW_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: target/opt-focused-macos-compiler
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_subject }}
          fetch-depth: 1
          lfs: false
      - name: Require successful grouped verification for the exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$VERIFICATION_RUN_ID"
          [[ "$SOURCE_SUBJECT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SUBJECT"
          gh run view "$VERIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json name,event,status,conclusion,headSha > prior-run.json
          python3 - "$SOURCE_SUBJECT" prior-run.json <<'PYCODE'
          import json, sys
          source, path = sys.argv[1:]
          run = json.load(open(path))
          if (run.get("name") != "Focused canonical source repair" or
              run.get("event") != "workflow_dispatch" or
              run.get("status") != "completed" or run.get("conclusion") != "success"):
              raise SystemExit("verification run is not the successful focused workflow")
          if run.get("headSha") != __import__("os").environ["WORKFLOW_SHA"]:
              raise SystemExit("verification used a different workflow commit")
          PYCODE
      - name: Retrieve and verify prior focused evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opt-focused-next-batch
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: verification-evidence
      - name: Bind prior evidence to source and workflow run
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SUBJECT" prior-run.json verification-evidence/results.json verification-evidence/adapter-results.json <<'PYCODE'
          import json, sys
          source, run_path, result_path, adapters_path = sys.argv[1:]
          run = json.load(open(run_path)); result = json.load(open(result_path))
          adapters = json.load(open(adapters_path))
          if result.get("source_subject") != source or result.get("workflow_head") != run.get("headSha"):
              raise SystemExit("focused evidence source/workflow binding mismatch")
          rows = result.get("rows", [])
          if not rows or any(row.get("exit_code") != 0 or row.get("zero_selected_error") or
                             row.get("selected_count_mismatch") for row in rows):
              raise SystemExit("focused checks were incomplete or failed")
          if len(adapters) != 2 or any(row.get("source_subject") != source or
                                       row.get("workflow_head") != run.get("headSha") or
                                       row.get("qualification_result", {}).get("accepted") is not True
                                       for row in adapters):
              raise SystemExit("both offline 49-case adapter receipts are required")
          PYCODE
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Build and archive the exact-source macOS compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SUBJECT"
          rustc -Vv | tee rustc-version.txt
          grep -Fx 'host: aarch64-apple-darwin' rustc-version.txt
          cargo fetch --locked
          cargo build --locked --offline -p semaprax --bin semaprax
          mkdir -p macos-compiler-artifact
          cp target/opt-focused-macos-compiler/debug/semaprax macos-compiler-artifact/semaprax
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, platform, subprocess
          binary = pathlib.Path("macos-compiler-artifact/semaprax")
          identity = {
              "source_subject": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_sha": __import__("os").environ["WORKFLOW_SHA"],
              "verification_run_id": __import__("os").environ["VERIFICATION_RUN_ID"],
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "binary_size_bytes": binary.stat().st_size,
              "rustc_vv": subprocess.check_output(["rustc", "-Vv"], text=True),
              "uname": {"system": platform.system(), "release": platform.release(),
                        "version": platform.version(), "machine": platform.machine()},
              "cargo_command": ["cargo", "build", "--locked", "--offline", "-p", "semaprax", "--bin", "semaprax"],
              "full_gates": False,
          }
          path = pathlib.Path("macos-compiler-artifact/identity.json")
          path.write_text(json.dumps(identity, indent=2) + "\n")
          pathlib.Path("macos-compiler-artifact/semaprax-macos-aarch64.tar.gz").write_bytes(
              __import__("subprocess").check_output(["tar", "-czf", "-", "-C", "macos-compiler-artifact", "semaprax", "identity.json"]))
          PYCODE
      - name: Preserve exact-source macOS compiler archive and identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opt-focused-next-batch-macos-compiler
          path: macos-compiler-artifact/
          retention-days: 7

name: Focused next-batch 706-713 verification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Focused source verification or a separate exact-source macOS compiler build
        required: true
        type: choice
        default: verify
        options:
          - verify
          - macos-compiler
      source_subject:
        description: Exact integrated source commit under verification
        required: true
        type: string
      verification_run_id:
        description: Successful focused verification run ID required for macOS compiler packaging
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: opt-focused-next-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: ${{ inputs.profile == 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SUBJECT: ${{ inputs.source_subject }}
      SEMAPRAX_REQUIRE_VIEW_OWNERSHIP_COMPOSITION: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: target/opt-focused-706-709
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
      - name: Restore private hosted Cargo intermediates
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/opt-focused-706-709
          key: opt-focused-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}
          restore-keys: opt-focused-ubuntu24-rust1971-debug0-v1-
      - name: Verify exact source subject and workflow-only overlay
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SUBJECT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$SOURCE_SUBJECT^{commit}"
          git merge-base --is-ancestor "$SOURCE_SUBJECT" HEAD
          python3 - "$SOURCE_SUBJECT" <<'PYCODE'
          import subprocess, sys
          source = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", source, "HEAD"], text=True
          ).splitlines()
          unexpected = [path for path in changed if path != ".github/workflows/ci.yml"]
          if unexpected:
              raise SystemExit("source overlay contains non-workflow changes: " + ", ".join(unexpected))
          print("SOURCE_SUBJECT=" + source)
          print("WORKFLOW_HEAD=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          PYCODE
          cargo fetch --locked
          clang --version >/dev/null
      - name: Focused owning checks, generators, replay, and scoped clippy
        id: focused
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PYCODE'
          import difflib, hashlib, json, pathlib, re, subprocess, sys, time
          out = pathlib.Path("focused-evidence")
          out.mkdir(exist_ok=True)
          commands = [
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::loan_retention::tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "semantic_cache_store_cli_v1", "persisted_nonempty_loan_plan_replays_with_exact_zero_resolution_warm_accounting", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "bounded_output::tests::required_reservations_admit_exact_bytes_and_refuse_one_short", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "bounded_output::tests::required_floor_refusal_stays_failed_after_the_trailer_is_written", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::ids::shared_identity_tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "loan_plan::shared_identity_tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::cache_codec::tests::expression_id_cache_wire_matches_string_and_round_trips_escaped_utf8", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::cache_codec::tests::owned_string_byte_slice_provenance_round_trips_through_hir_cache_codec", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::expected_projection::call_sites::tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::retained_validation::type_projection::tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::tests::builder_limits::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "rendered_document_has_literal_sha_exact_wire_order_and_digest_binding", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "committed_bundle_is_pinned_and_regenerates_byte_identical", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project", "standard_library::pattern_executes_on_all_three_backends", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project_cli_v1", "native_test::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "documentation", "agent_quick_reference::diagnostic_help_is_pinned_and_covers_compiler_checked_examples", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project", "standard_library::committed_catalogs_match_the_sources", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "workspace", "semantic_graph::expected_projection_source_boundary_is_pure_and_keeps_shared_helpers_in_root", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "cli_help_surface_v1", "standalone_scoped_help_is_exhaustive_exact_capability_aware_and_inert", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "build", "--locked", "--offline", "-p", "semaprax", "--bin", "semaprax"],
              ["cargo", "clippy", "--locked", "--offline", "-p", "semaprax", "--lib", "--bin", "semaprax", "--bench", "interpreter", "--", "-D", "warnings"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::validation::call_parameters::tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::validation::nominal_facts::tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::private_capacity_contract_tests::cleanup_capacity_", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "implementation::tests::cleanup_census::hir_retained_capacity_counts_complete_loan_plans_on_generic_instances", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "implementation::tests::ledger_capacity::hir_complete_reservation_is_exact_and_one_less_prevents_resolution", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "clippy", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "--", "-D", "warnings"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "implementation::tests::cleanup_census::hir_expression_capacity_counts_import_and_host_call_backings_exactly", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "implementation::tests::cleanup_census::hir_loan_plan_capacity_counts_single_expression_backing_exactly", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "implementation::tests::hir_traversal::nominal_facts_lookup_forecast_coexists_with_validator_and_fallback_scratch", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::expected_projection::cost::identity_prebound_carriers_", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax-native-rust-interop", "--lib", "implementation::tests::ledger_capacity::hir_capacity_layout_constants_are_bound_to_root_const_assertions", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "hir_module_boundaries", "core_validation_has_no_resolution_cleanup_build_or_physical_authority", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::validation::borrowed_bytes_call_tests::", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "scalar_status_backend_equivalence", "view_ownership_composition::fused_owned_string_byte_view_agrees_across_interpreter_native_and_core_wasm", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::tests::source_repair::unknown_import_help_names_the_exact_provider_without_repairing_identity", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::lazy_slot_scalar_calls_and_bindings_need_no_discarded_identity_text", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::lazy_slot_zero_array_and_recursive_nominal_slots_keep_exact_facts", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::lazy_slot_invalid_nominal_type_refuses_before_materializing_identity", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::inline_array_payload_", "--", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::only_byte_bearing_slots_are_recorded_and_the_empty_array_still_is", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::capacity_inputs_report_parameters_then_result_then_body_slots", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::an_array_literal_argument_charges_both_staging_and_a_temporary", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::a_frame_of_exactly_the_inline_array_limit_is_admitted", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "hir::byte_capacity::tests::one_byte_past_the_inline_array_limit_is_rejected", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "cleanup_plan::renewal_profile::tests::renewal_binding_index_preserves_lookup_priority_for_duplicate_ids", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "cleanup_plan::replay::renewal::tests::ordinary_vec_renewal_rejects_missing_forged_and_downgraded_proofs", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "cleanup_plan::replay::renewal::tests::byte_renewal_rejects_missing_forged_downgraded_and_unauthenticated_proofs", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "workspace_graph::tests::source_repair::noncanonical_workspace_source_reports_project_format_repair", "--", "--exact", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project", "source_command_native_tests_", "--", "--nocapture", "--test-threads=1"],
          ]
          rows = []
          graph_wire_pin_failed = False
          required_failures = False
          # Compile the owning library test harness once before any pin generators.
          precheck = ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib",
                      "project::incremental::snapshot::loan_replay::tests::", "--", "--nocapture", "--test-threads=1"]
          log = out / "compile-and-loan-replay.log"
          with log.open("wb") as stream:
              result = subprocess.run(precheck, stdout=stream, stderr=subprocess.STDOUT)
          data = log.read_bytes()
          selected = sum(map(int, re.findall(rb"test result: ok\. ([0-9]+) passed", data))) if result.returncode == 0 else 0
          rows.append({"command": precheck, "exit_code": result.returncode, "log_path": log.name,
                       "selected_passed": selected, "expected_selected": 5, "selected_count_mismatch": selected != 5,
                       "log_sha256": hashlib.sha256(data).hexdigest()})
          required_failures |= bool(result.returncode or selected != 5)
          if b"could not compile" in data or b"error[E" in data:
              (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
              print(data.decode(errors="replace")[-8000:], flush=True)
              raise SystemExit(1)
          pin_paths = ["std/catalog.json", "docs/STANDARD-LIBRARY-CATALOG.md",
                       "docs/AGENT-DIAGNOSTIC-HELP.json", "docs/AGENT-SKILL-BUNDLE-V1.json"]
          before_dir = out / "pins-before"
          after_dir = out / "pins-after"
          for name in pin_paths:
              target = before_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(pathlib.Path(name).read_bytes())
          generators = [
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "documentation", "regenerate_diagnostic_help", "--", "--ignored", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "regenerate_committed_bundle", "--", "--ignored", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project", "standard_library::regenerate_catalogs", "--", "--ignored", "--nocapture", "--test-threads=1"],
          ]
          for i, command in enumerate(generators):
              log = out / f"generator-{i:02}.log"
              print("START generator", i, " ".join(command), flush=True)
              with log.open("wb") as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              matches = re.findall(rb"test result: ok\. ([0-9]+) passed", data) if result.returncode == 0 else []
              selected = sum(map(int, matches))
              row = {"command": command, "exit_code": result.returncode,
                     "selected_passed": selected, "log_path": log.name,
                     "log_sha256": hashlib.sha256(data).hexdigest()}
              if not selected: row["zero_selected_error"] = True
              rows.append(row)
              required_failures |= bool(result.returncode or row.get("zero_selected_error"))
              print("DONE generator", i, row, flush=True)
              if result.returncode or not selected:
                  print(data.decode(errors="replace")[-4000:], flush=True)
          pin_diff = bytearray()
          for name in pin_paths:
              target = after_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              current = pathlib.Path(name).read_bytes()
              target.write_bytes(current)
              before = (before_dir / name).read_bytes()
              pin_diff.extend(b"".join(difflib.diff_bytes(
                  difflib.unified_diff, before.splitlines(keepends=True), current.splitlines(keepends=True),
                  fromfile=("a/" + name).encode(), tofile=("b/" + name).encode(), lineterm=b"\n")))
              pathlib.Path(name).write_bytes((before_dir / name).read_bytes())
          (out / "pins.patch").write_bytes(bytes(pin_diff))
          for i, command in enumerate(commands):
              if command[1] == "test":
                  if "--" not in command:
                      command.extend(["--", "--test-threads=1"])
                  elif "--test-threads=1" not in command:
                      command.append("--test-threads=1")
              log = out / f"{i:02}.log"
              started = time.monotonic()
              print("START", i, " ".join(command), flush=True)
              with log.open("wb") as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              row = {"command": command, "exit_code": result.returncode,
                     "seconds": round(time.monotonic() - started, 3), "log_path": log.name,
                     "log_sha256": hashlib.sha256(data).hexdigest()}
              if command[1] == "test":
                  summaries = re.findall(
                      rb"(?m)^test result: (?:ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed(?:; ([0-9]+) ignored)?(?:;|,)",
                      data,
                  )
                  row["selected_passed"] = sum(int(summary[0]) for summary in summaries)
                  row["selected_observed"] = sum(
                      int(summary[0]) + int(summary[1]) for summary in summaries
                  )
                  if not row["selected_observed"]:
                      row["zero_selected_error"] = True
              if command[1] == "test" and "semaprax-native-rust-interop" in command:
                  row["expected_selected"] = 1
              if command[1] == "test" and "workspace_graph::loan_retention::tests::" in command:
                  row["expected_selected"] = 6
              if command[1] == "test" and "hir::validation::call_parameters::tests::" in command:
                  row["expected_selected"] = 4
              if command[1] == "test" and "core_validation_has_no_resolution_cleanup_build_or_physical_authority" in command:
                  row["expected_selected"] = 1
              if command[1] == "test" and "hir::validation::borrowed_bytes_call_tests::" in command:
                  row["expected_selected"] = 12
              if command[1] == "test" and "hir::validation::nominal_facts::tests::" in command:
                  row["expected_selected"] = 8
              if command[1] == "test" and "hir::private_capacity_contract_tests::cleanup_capacity_" in command:
                  row["expected_selected"] = 3
              if command[1] == "test" and "workspace_graph::expected_projection::cost::identity_prebound_carriers_" in command:
                  row["expected_selected"] = 3
              if command[1] == "test" and "implementation::capacity::cleanup_events::carrier_tests::" in command:
                  row["expected_selected"] = 3
              exact_expected = {
                  "fused_owned_string_byte_view_agrees_across_interpreter_native_and_core_wasm": 1,
                  "unknown_import_help_names_the_exact_provider_without_repairing_identity": 1,
                  "lazy_slot_scalar_calls_and_bindings_need_no_discarded_identity_text": 1,
                  "lazy_slot_zero_array_and_recursive_nominal_slots_keep_exact_facts": 1,
                  "lazy_slot_invalid_nominal_type_refuses_before_materializing_identity": 1,
                  "only_byte_bearing_slots_are_recorded_and_the_empty_array_still_is": 1,
                  "capacity_inputs_report_parameters_then_result_then_body_slots": 1,
                  "an_array_literal_argument_charges_both_staging_and_a_temporary": 1,
                  "a_frame_of_exactly_the_inline_array_limit_is_admitted": 1,
                  "one_byte_past_the_inline_array_limit_is_rejected": 1,
                  "renewal_binding_index_preserves_lookup_priority_for_duplicate_ids": 1,
                  "ordinary_vec_renewal_rejects_missing_forged_and_downgraded_proofs": 1,
                  "byte_renewal_rejects_missing_forged_downgraded_and_unauthenticated_proofs": 1,
                  "noncanonical_workspace_source_reports_project_format_repair": 1,
              }
              for selector, expected in exact_expected.items():
                  if selector in command:
                      row["expected_selected"] = expected
              if command[1] == "test" and "hir::byte_capacity::tests::inline_array_payload_" in command:
                  row["expected_selected"] = 2
              if command[1] == "test" and "source_command_native_tests_" in command:
                  row["expected_selected"] = 2
              if command[1] == "test" and "native_test::" in command:
                  row["expected_selected"] = 5
              if command[1] == "test" and "standard_library::cross_backend_capture::native_capture_" in command:
                  row["expected_selected"] = 3
              if row.get("expected_selected") is not None:
                  row["selected_count_mismatch"] = row.get("selected_observed") != row["expected_selected"]
              if "rendered_document_has_literal_sha_exact_wire_order_and_digest_binding" in command:
                  graph_wire_pin_failed = bool(result.returncode or row.get("zero_selected_error"))
              required_failures |= bool(result.returncode or row.get("zero_selected_error") or row.get("selected_count_mismatch"))
              rows.append(row)
              (out / "results.json").write_text(json.dumps({
                  "source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
              print("DONE", i, row, flush=True)
              if result.returncode or row.get("zero_selected_error") or row.get("selected_count_mismatch"):
                  print(data.decode(errors="replace")[-4000:], flush=True)
              if b"could not compile" in data or b"error[E" in data:
                  break
          if graph_wire_pin_failed:
              command = ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib",
                         "workspace_graph::type_proof_tests::projection_tests::emit_projection_wire_pin_candidate",
                         "--", "--ignored", "--nocapture", "--test-threads=1"]
              log = out / "graph-wire-candidate-producer.log"
              print("START conditional owning graph-wire candidate producer", flush=True)
              with log.open("wb") as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              selected = sum(map(int, re.findall(rb"test result: ok\. ([0-9]+) passed", data))) if result.returncode == 0 else 0
              rows.append({"command": command, "exit_code": result.returncode, "selected_passed": selected,
                           "expected_selected": 1, "selected_count_mismatch": selected != 1,
                           "log_sha256": hashlib.sha256(data).hexdigest(), "conditional_on_wire_pin_failure": True})
              (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
          # The candidate producer is evidence only and can never convert a failed literal pin into success.
          failed = required_failures or len(rows) < len(commands)
          generated = subprocess.run(["git", "diff", "--exit-code", "--", *pin_paths], capture_output=True)
          if generated.returncode:
              failed = True
              (out / "generated-source-diff.log").write_bytes(generated.stdout + generated.stderr)
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required_passed={'false' if failed else 'true'}\n")
          sys.exit(int(failed))
          PYCODE
      - name: Offline 49-case qualification of both original matcher adapters
        if: steps.focused.outputs.required_passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQUAL'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, sys, tempfile, time
          root = Path.cwd().resolve(); out = Path("focused-evidence"); out.mkdir(exist_ok=True)
          compiler = root / "target/opt-focused-706-709/debug/semaprax"
          sys.path.insert(0, str(root / "benchmarks/cli-tokens-v1"))
          import live_campaign
          settings = {"round": 6, "qualification": live_campaign.qualification.metadata(),
                      "seed_files_sha256": live_campaign.ROUND_SEED_SHA256[6]}
          live_campaign.qualification.require_settings(settings)
          env = live_campaign.trial_environment(compiler); env["SEMAPRAX_BIN"] = str(compiler)
          node = subprocess.check_output(["node", "--version"], text=True, env=env).strip()
          assert node == "v24.3.0", node
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          inventory = lambda d: {str(p.relative_to(d)): sha(p) for p in sorted(d.rglob("*")) if p.is_file()}
          compiler_before = sha(compiler); rows = []
          for variant in ("matcher-adapted", "matcher-package-adapted"):
              source = root / "experiments/ascii-pattern-source/loglens-reference" / variant
              assert not any(p.is_symlink() for p in source.rglob("*"))
              candidate = Path(tempfile.mkdtemp(prefix="spx-loglens-", dir=os.environ["RUNNER_TEMP"])).resolve() / "candidate"
              shutil.copytree(source, candidate); source_files = inventory(source)
              assert inventory(candidate) == source_files
              sample = root / "benchmarks/cli-tokens-v1/sample.log"
              shutil.copy2(sample, candidate.parent / "sample.log"); assert sha(candidate.parent / "sample.log") == sha(sample)
              evidence = out / variant; assert not evidence.exists(), "qualification evidence must be fresh"
              started = time.monotonic()
              result = live_campaign.check_program_for_campaign(candidate, 240, env, settings, "semaprax", evidence)
              row = {"variant": variant, "source_files_sha256": source_files,
                     "sibling_sample_sha256": sha(sample), "compiler_sha256": compiler_before,
                     "source_subject": os.environ["SOURCE_SUBJECT"],
                     "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                     "node_version": node, "seconds": round(time.monotonic() - started, 3),
                     "qualification_result": result, "model_dispatch": "none"}
              if (candidate / "loglens").is_file(): row["native_binary_sha256"] = sha(candidate / "loglens")
              (out / f"{variant}-receipt.json").write_text(json.dumps(row, indent=2) + "\n")
              rows.append(row); print(json.dumps(row, indent=2), flush=True)
              assert sha(compiler) == compiler_before, "compiler changed during qualification"
              shutil.rmtree(candidate.parent)
          (out / "adapter-results.json").write_text(json.dumps(rows, indent=2) + "\n")
          sys.exit(0 if all(row["qualification_result"].get("accepted") is True for row in rows) else 1)
          PYQUAL
      - name: Preserve focused verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opt-focused-next-batch
          path: focused-evidence/
          retention-days: 7
      - name: Save private hosted Cargo intermediates
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/opt-focused-706-709
          key: opt-focused-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}

  macos-compiler:
    if: ${{ inputs.profile == 'macos-compiler' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE_SUBJECT: ${{ inputs.source_subject }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      WORKFLOW_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: target/opt-focused-macos-compiler
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_subject }}
          fetch-depth: 1
          lfs: false
      - name: Require successful grouped verification for the exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$VERIFICATION_RUN_ID"
          [[ "$SOURCE_SUBJECT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SUBJECT"
          gh run view "$VERIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json name,event,status,conclusion,headSha > prior-run.json
          python3 - "$SOURCE_SUBJECT" prior-run.json <<'PYCODE'
          import json, sys
          source, path = sys.argv[1:]
          run = json.load(open(path))
          if (run.get("name") != "Focused 706-709 verification" or
              run.get("event") != "workflow_dispatch" or
              run.get("status") != "completed" or run.get("conclusion") != "success"):
              raise SystemExit("verification run is not the successful focused workflow")
          if run.get("headSha") != __import__("os").environ["WORKFLOW_SHA"]:
              raise SystemExit("verification used a different workflow commit")
          PYCODE
      - name: Retrieve and verify prior focused evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opt-focused-706-709
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: verification-evidence
      - name: Bind prior evidence to source and workflow run
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SUBJECT" prior-run.json verification-evidence/results.json verification-evidence/adapter-results.json <<'PYCODE'
          import json, sys
          source, run_path, result_path, adapters_path = sys.argv[1:]
          run = json.load(open(run_path)); result = json.load(open(result_path))
          adapters = json.load(open(adapters_path))
          if result.get("source_subject") != source or result.get("workflow_head") != run.get("headSha"):
              raise SystemExit("focused evidence source/workflow binding mismatch")
          rows = result.get("rows", [])
          if not rows or any(row.get("exit_code") != 0 or row.get("zero_selected_error") or
                             row.get("selected_count_mismatch") for row in rows):
              raise SystemExit("focused checks were incomplete or failed")
          if len(adapters) != 2 or any(row.get("source_subject") != source or
                                       row.get("workflow_head") != run.get("headSha") or
                                       row.get("qualification_result", {}).get("accepted") is not True
                                       for row in adapters):
              raise SystemExit("both offline 49-case adapter receipts are required")
          PYCODE
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Build and archive the exact-source macOS compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SUBJECT"
          rustc -Vv | tee rustc-version.txt
          grep -Fx 'host: aarch64-apple-darwin' rustc-version.txt
          cargo fetch --locked
          cargo build --locked --offline -p semaprax --bin semaprax
          mkdir -p macos-compiler-artifact
          cp target/opt-focused-macos-compiler/debug/semaprax macos-compiler-artifact/semaprax
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, platform, subprocess
          binary = pathlib.Path("macos-compiler-artifact/semaprax")
          identity = {
              "source_subject": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_sha": __import__("os").environ["WORKFLOW_SHA"],
              "verification_run_id": __import__("os").environ["VERIFICATION_RUN_ID"],
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "binary_size_bytes": binary.stat().st_size,
              "rustc_vv": subprocess.check_output(["rustc", "-Vv"], text=True),
              "uname": {"system": platform.system(), "release": platform.release(),
                        "version": platform.version(), "machine": platform.machine()},
              "cargo_command": ["cargo", "build", "--locked", "--offline", "-p", "semaprax", "--bin", "semaprax"],
              "full_gates": False,
          }
          path = pathlib.Path("macos-compiler-artifact/identity.json")
          path.write_text(json.dumps(identity, indent=2) + "\n")
          pathlib.Path("macos-compiler-artifact/semaprax-macos-aarch64.tar.gz").write_bytes(
              __import__("subprocess").check_output(["tar", "-czf", "-", "-C", "macos-compiler-artifact", "semaprax", "identity.json"]))
          PYCODE
      - name: Preserve exact-source macOS compiler archive and identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opt-focused-next-batch-macos-compiler
          path: macos-compiler-artifact/
          retention-days: 7

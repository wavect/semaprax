name: Grouped compiler repair checks
# DRAFT proposal only: final joined source census; the selectors below have not been executed.
# Census bound statically to joined source 156c9991ba5a8e906f8d7202e9205785c07dc2bc; SOURCE_SUBJECT must select these exact source bytes.
# Focused checks and generators remain unexecuted by this draft preparation; no full gates are selected.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Authentic candidate production or source-bound focused verification
        required: true
        type: choice
        default: verify
        options:
          - verify
          - produce
          - canonical
      source_subject:
        description: Final frozen compiler source SHA after implementation integration
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: opt-grouped-successor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: ${{ inputs.profile == 'verify' || inputs.profile == 'produce' || inputs.profile == 'canonical' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SUBJECT: ${{ inputs.source_subject }} # exact joined source 156c9991ba5a8e906f8d7202e9205785c07dc2bc
      PRODUCER_ONLY: ${{ inputs.profile == 'produce' || inputs.profile == 'canonical' }}
      CANONICAL_ONLY: ${{ inputs.profile == 'canonical' }}
      SEMAPRAX_REQUIRE_VIEW_OWNERSHIP_COMPOSITION: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: target/grouped-successor-focused
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
      - name: Restore private hosted Cargo intermediates
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/grouped-successor-focused
          key: opt-grouped-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}
          restore-keys: opt-grouped-ubuntu24-rust1971-debug0-v1-
      - name: Verify exact source subject and workflow-only overlay
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SUBJECT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SUBJECT" == "156c9991ba5a8e906f8d7202e9205785c07dc2bc" ]]
          git cat-file -e "$SOURCE_SUBJECT^{commit}"
          git merge-base --is-ancestor "$SOURCE_SUBJECT" HEAD
          python3 - "$SOURCE_SUBJECT" <<'PYCODE'
          import subprocess, sys
          source = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", source, "HEAD"], text=True
          ).splitlines()
          unexpected = [path for path in changed if path != ".github/workflows/ci.yml"]
          if unexpected:
              raise SystemExit("source overlay contains non-workflow changes: " + ", ".join(unexpected))
          print("SOURCE_SUBJECT=" + source)
          print("WORKFLOW_HEAD=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          PYCODE
          cargo fetch --locked
          clang --version >/dev/null
      - name: Focused owning checks, generators, replay, and scoped clippy
        id: focused
        timeout-minutes: 160
        shell: bash
        run: |
          set -uo pipefail

name: CI

# Triggers are deliberately narrow: a push to `main`, a `v*` release tag, or
# an explicit manual dispatch. CI does not run on other branches and does not run on
# `pull_request`. This repository takes direct pushes to `main` from many
# worktrees and agent sessions; running the full matrix on every intermediate
# branch push spent runner capacity on refs nothing gates on. Branch protection
# is not applied here (see docs/CI-REQUIRED-CHECKS-V1.md), so no required check
# depended on the `pull_request` trigger. Use `workflow_dispatch` to check a
# branch before merging it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # CI is a latest-ref health signal. A newer push or manual dispatch on the
  # same ref makes the older run stale, so stop it instead of spending runner
  # minutes finishing a matrix whose result will immediately be superseded.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  std08-prefix-diagnostic:
    name: STD-08 preparation ledger diagnostic (not qualification)
    runs-on: ubuntu-24.04
    # The complete per-package backend audit also reached 60 minutes after
    # passing its logging and catalog selectors; retain the remaining gates.
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: target/std08-prefix-diagnostic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          lfs: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Resolve held native tools
        shell: bash
        run: |
          set -euo pipefail
          clang_path="$(command -v clang)"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            clang_path="$(readlink -f "$clang_path")"
          fi
          echo "CLANG=$clang_path" >> "$GITHUB_ENV"
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Observe the existing first-manifest preparation and preserve its failure
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --offline -p semaprax --lib \
            workspace_graph::tests::codec808_frontier::std08_io_lines_preparation_reports_actual_ledger_and_preserves_failure \
            -- --exact --ignored --nocapture --test-threads 1

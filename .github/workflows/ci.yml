name: Focused implementation-batch 706-730 verification
# Exact joined source bound by source_subject; focused only, no full gates/unfiltered suite.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Focused source verification or a separate exact-source macOS compiler build
        required: true
        type: choice
        default: verify
        options:
          - verify
          - macos-compiler
      source_subject:
        description: Final exact source SHA after compiler, codec, v31 routing and benchmark-profile batch integration
        required: true
        type: string
      verification_run_id:
        description: Successful focused verification run ID required for macOS compiler packaging
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: opt-focused-next-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: ${{ inputs.profile == 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SUBJECT: ${{ inputs.source_subject }} # final held-batch subject; placeholder until source freeze
      SEMAPRAX_REQUIRE_VIEW_OWNERSHIP_COMPOSITION: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: target/opt-focused-706-709
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.97.1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.3.0
      - name: Restore private hosted Cargo intermediates
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/opt-focused-706-709
          key: opt-focused-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}
          restore-keys: opt-focused-ubuntu24-rust1971-debug0-v1-
      - name: Verify exact source subject and workflow-only overlay
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SUBJECT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$SOURCE_SUBJECT^{commit}"
          git merge-base --is-ancestor "$SOURCE_SUBJECT" HEAD
          python3 - "$SOURCE_SUBJECT" <<'PYCODE'
          import subprocess, sys
          source = sys.argv[1]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", source, "HEAD"], text=True
          ).splitlines()
          unexpected = [path for path in changed if path != ".github/workflows/ci.yml"]
          if unexpected:
              raise SystemExit("source overlay contains non-workflow changes: " + ", ".join(unexpected))
          print("SOURCE_SUBJECT=" + source)
          print("WORKFLOW_HEAD=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          PYCODE
          cargo fetch --locked
          clang --version >/dev/null
      - name: Focused owning checks, generators, replay, and scoped clippy
        id: focused
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PYCODE'
          import difflib, hashlib, json, pathlib, re, subprocess, sys, time
          out = pathlib.Path("focused-evidence")
          out.mkdir(exist_ok=True)
          commands = [
              ['cargo', 'test', '--locked', '--offline', '-p', 'semaprax', '--test', 'projections', 'installed_diagnostics::', '--', '--nocapture', '--test-threads=1'],

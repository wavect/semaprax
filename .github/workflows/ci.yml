                  with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
                      output.write("required_passed=false\n")
              atexit.register(record_canonical_early_failure)
          graph_wire_pin_failed = False
          required_failures = False
          # Build the production binary first so test-only cfg(test) visibility
          # cannot mask a production compile failure before generators or tests.
          production_build = ["cargo", "build", "--locked", "--offline", "-p", "semaprax", "--bin", "semaprax"]
          build_log = out / "production-binary-build.log"
          print("START production binary build", " ".join(production_build), flush=True)
          with build_log.open("wb") as stream:
              build_result = subprocess.run(production_build, stdout=stream, stderr=subprocess.STDOUT)
          build_data = build_log.read_bytes()
          build_row = {"command": production_build, "exit_code": build_result.returncode,
                       "log_path": build_log.name,
                       "log_sha256": hashlib.sha256(build_data).hexdigest()}
          rows.append(build_row)
          if build_result.returncode:
              (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "profile": "canonical" if canonical_only else ("produce" if producer_only else "verify"),
                  "qualification": False, "owner_checks_executed": False,
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
              print(build_data.decode(errors="replace")[-8000:], flush=True)
              raise SystemExit(1)
          print("DONE production binary build", build_row, flush=True)
          if not canonical_only:
              # Compile the owning library test harness without running a selector;
              # the loan replay group runs once in the ordered command list below.
              precheck = ["cargo", "test", "--no-run", "--locked", "--offline", "-p", "semaprax", "--lib"]
              log = out / "compile-library-tests.log"
              with log.open("wb") as stream:
                  result = subprocess.run(precheck, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              rows.append({"command": precheck, "exit_code": result.returncode, "log_path": log.name,
                           "compile_only": True, "log_sha256": hashlib.sha256(data).hexdigest()})
              required_failures |= bool(result.returncode)
              if b"could not compile" in data or b"error[E" in data:
                  (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                      "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                      "profile": "canonical" if canonical_only else ("produce" if producer_only else "verify"),
                      "qualification": False, "owner_checks_executed": False,
                      "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
                  print(data.decode(errors="replace")[-8000:], flush=True)
                  raise SystemExit(1)
          pin_paths = ["std/catalog.json", "docs/STANDARD-LIBRARY-CATALOG.md",
                       "docs/AGENT-DIAGNOSTIC-HELP.json", "docs/AGENT-SKILL-BUNDLE-V1.json"]
          before_dir = out / "pins-before"
          after_dir = out / "pins-after"
          for name in pin_paths:
              target = before_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(pathlib.Path(name).read_bytes())
          generators = [
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "documentation", "regenerate_diagnostic_help", "--", "--ignored", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "regenerate_committed_bundle", "--", "--ignored", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project", "standard_library::regenerate_catalogs", "--", "--ignored", "--nocapture", "--test-threads=1"],
          ]
          if not canonical_only:
              for i, command in enumerate(generators):
                  log = out / f"generator-{i:02}.log"
                  print("START generator", i, " ".join(command), flush=True)
                  with log.open("wb") as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
                  data = log.read_bytes()
                  matches = re.findall(rb"test result: ok\. ([0-9]+) passed", data) if result.returncode == 0 else []
                  selected = sum(map(int, matches))
                  row = {"command": command, "exit_code": result.returncode,
                         "selected_passed": selected, "log_path": log.name,
                         "log_sha256": hashlib.sha256(data).hexdigest()}
                  if not selected: row["zero_selected_error"] = True
                  rows.append(row)
                  required_failures |= bool(result.returncode or row.get("zero_selected_error"))
                  print("DONE generator", i, row, flush=True)
                  if result.returncode or not selected:
                      print(data.decode(errors="replace")[-4000:], flush=True)
          pin_diff = bytearray()
          for name in pin_paths:
              target = after_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              current = pathlib.Path(name).read_bytes()
              target.write_bytes(current)
              before = (before_dir / name).read_bytes()
              for line in difflib.diff_bytes(
                      difflib.unified_diff, before.splitlines(keepends=True), current.splitlines(keepends=True),
                      fromfile=("a/" + name).encode(), tofile=("b/" + name).encode(), lineterm=b"\n"):
                  pin_diff.extend(line)
                  if not line.endswith(b"\n"):
                      pin_diff.extend(b"\n\\ No newline at end of file\n")
              pathlib.Path(name).write_bytes((before_dir / name).read_bytes())
          (out / "pins.patch").write_bytes(bytes(pin_diff))
          # Canonical candidates are evidence only. Format retained copies, never
          # committed inputs, so subsequent owning checks still test the frozen head.
          canonical_roots = [
              "examples/catalog-scoped-record-successor/src",
              "examples/collection-record-order/src",
              "examples/nested-order-json-project/src",
              "examples/owned-json-command-project/src",
              "examples/owned-leaf-command-project/src",
              "examples/shiftsim-typed-record-successor/src",
              "examples/stream-nested-order-json-project/src",
              "examples/stream-utf8-owned-json-project/src",
          ]
          canonical_dir = out / "canonical-examples"
          canonical_dir.mkdir(exist_ok=False)
          canonical_before = canonical_dir / "before"
          canonical_after = canonical_dir / "after"
          subject = __import__("os").environ["SOURCE_SUBJECT"]
          compiler = pathlib.Path(__import__("os").environ["CARGO_TARGET_DIR"]) / "debug/semaprax"
          if compiler.is_symlink() or not compiler.is_file():
              raise RuntimeError("canonical producer requires the freshly built regular compiler")
          compiler = compiler.resolve(strict=True)
          compiler_hash = hashlib.sha256(compiler.read_bytes()).hexdigest()
          canonical_receipt = {
              "schema": "semaprax.canonical-source-candidates.v1",
              "source_subject": subject,

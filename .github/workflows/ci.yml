              precheck = ["cargo", "test", "--no-run", "--locked", "--offline", "-p", "semaprax", "--lib"]
              log = out / "compile-library-tests.log"
              with log.open("wb") as stream:
                  result = subprocess.run(precheck, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              rows.append({"command": precheck, "exit_code": result.returncode, "log_path": log.name,
                           "compile_only": True, "log_sha256": hashlib.sha256(data).hexdigest()})
              required_failures |= bool(result.returncode)
              if b"could not compile" in data or b"error[E" in data:
                  (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                      "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                      "profile": "canonical" if canonical_only else ("produce" if producer_only else "verify"),
                      "qualification": False, "owner_checks_executed": False,
                      "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
                  print(data.decode(errors="replace")[-8000:], flush=True)
                  raise SystemExit(1)
          pin_paths = ["std/catalog.json", "docs/STANDARD-LIBRARY-CATALOG.md",
                       "docs/AGENT-DIAGNOSTIC-HELP.json", "docs/AGENT-SKILL-BUNDLE-V1.json"]
          before_dir = out / "pins-before"
          after_dir = out / "pins-after"
          for name in pin_paths:
              target = before_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(pathlib.Path(name).read_bytes())
          generators = [
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "documentation", "regenerate_diagnostic_help", "--", "--ignored", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib", "regenerate_committed_bundle", "--", "--ignored", "--nocapture", "--test-threads=1"],
              ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--test", "project", "standard_library::regenerate_catalogs", "--", "--ignored", "--nocapture", "--test-threads=1"],
          ]
          if not canonical_only:
              for i, command in enumerate(generators):
                  log = out / f"generator-{i:02}.log"
                  print("START generator", i, " ".join(command), flush=True)
                  with log.open("wb") as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
                  data = log.read_bytes()
                  matches = re.findall(rb"test result: ok\. ([0-9]+) passed", data) if result.returncode == 0 else []
                  selected = sum(map(int, matches))
                  row = {"command": command, "exit_code": result.returncode,
                         "selected_passed": selected, "log_path": log.name,
                         "log_sha256": hashlib.sha256(data).hexdigest()}
                  row.update({"expected_selected": 1, "selected_observed": selected, "selected_count_mismatch": selected != 1})
                  if not selected: row["zero_selected_error"] = True
                  rows.append(row)
                  required_failures |= bool(result.returncode or row.get("zero_selected_error") or row["selected_count_mismatch"])
                  print("DONE generator", i, row, flush=True)
                  if result.returncode or not selected or row["selected_count_mismatch"]:
                      print(data.decode(errors="replace")[-4000:], flush=True)
          pin_diff = bytearray()
          for name in pin_paths:
              target = after_dir / name
              target.parent.mkdir(parents=True, exist_ok=True)
              current = pathlib.Path(name).read_bytes()
              target.write_bytes(current)
              before = (before_dir / name).read_bytes()
              for line in difflib.diff_bytes(
                      difflib.unified_diff, before.splitlines(keepends=True), current.splitlines(keepends=True),
                      fromfile=("a/" + name).encode(), tofile=("b/" + name).encode(), lineterm=b"\n"):
                  pin_diff.extend(line)
                  if not line.endswith(b"\n"):
                      pin_diff.extend(b"\n\\ No newline at end of file\n")
              pathlib.Path(name).write_bytes((before_dir / name).read_bytes())
          (out / "pins.patch").write_bytes(bytes(pin_diff))
          # Canonical candidates are evidence only. Format retained copies, never
          # committed inputs, so subsequent owning checks still test the frozen head.
          canonical_roots = binding["canonical_inventory"]["roots"]
          canonical_dir = out / "canonical-examples"
          canonical_dir.mkdir(exist_ok=False)
          canonical_before = canonical_dir / "before"
          canonical_after = canonical_dir / "after"
          subject = __import__("os").environ["SOURCE_SUBJECT"]
          compiler = pathlib.Path(__import__("os").environ["CARGO_TARGET_DIR"]) / "debug/semaprax"
          if compiler.is_symlink() or not compiler.is_file():
              raise RuntimeError("canonical producer requires the freshly built regular compiler")
          compiler = compiler.resolve(strict=True)
          compiler_hash = hashlib.sha256(compiler.read_bytes()).hexdigest()
          canonical_receipt = {
              "schema": "semaprax.canonical-source-candidates.v1",
              "source_subject": subject,
              "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "compiler_path": str(compiler), "compiler_sha256": compiler_hash,
              "production_build": build_row,
              "evidence_only": True, "committed_inputs_modified": False,
              "owning_checks_use_committed_inputs": not producer_only, "roots": canonical_roots,
              "expected_manifest_sha256": binding["expected_manifest_sha256"],
              "canonical_inventory_sha256": binding["canonical_inventory_sha256"],
              "qualification": False, "files": [],
          }
          if canonical_only:
              canonical_receipt["profile"] = "canonical"
          canonical_originals = {}
          try:
              selected_files = subprocess.check_output(["git", "ls-files", "-z", "--", *canonical_roots]).split(b"\0")
              selected_files = sorted(name.decode("utf-8") for name in selected_files if name and name.endswith(b".spx"))
              if any(not any(name.startswith(root + "/") for name in selected_files) for root in canonical_roots):
                  raise RuntimeError("canonical source inventory omits an explicitly selected example root")
              expected_files = binding["canonical_inventory"]["files"]
              if selected_files != [row["path"] for row in expected_files]:
                  raise RuntimeError("canonical inventory differs from exact final-source binding")
              if not selected_files or len(selected_files) > 128:
                  raise RuntimeError("canonical example source inventory is empty or exceeds its bound")
              # Retain every committed input before invoking any formatter.
              for name in selected_files:
                  original = pathlib.Path(name)
                  if any(component.is_symlink() for component in [original, *original.parents]) or not original.is_file():
                      raise RuntimeError("canonical source is not a regular no-symlink input: " + name)
                  before = subprocess.check_output(["git", "show", subject + ":" + name])
                  if len(before) > 65536 or original.read_bytes() != before:
                      raise RuntimeError("canonical source differs from frozen subject or exceeds bound: " + name)
                  if hashlib.sha256(before).hexdigest() != next(row["sha256"] for row in expected_files if row["path"] == name):
                      raise RuntimeError("canonical source hash mismatch: " + name)
                  canonical_originals[name] = before
                  for directory in [canonical_before, canonical_after]:
                      target = directory / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open("xb") as stream:
                          stream.write(before)
              for index, name in enumerate(selected_files):
                  candidate = canonical_after / name
                  file_row = {"path": name, "before_path": str(canonical_before / name),
                              "after_path": str(candidate), "before_sha256": hashlib.sha256(canonical_originals[name]).hexdigest(),
                              "commands": []}
                  canonical_receipt["files"].append(file_row)
                  for phase, argv in [("format", [str(compiler), "fmt", str(candidate)]),
                                      ("check", [str(compiler), "fmt", str(candidate), "--check"])]:
                      if phase == "check" and file_row["commands"][0]["exit_code"]:
                          break
                      log = canonical_dir / f"{index:02}-{phase}.log"
                      started = time.time()
                      with log.open("xb") as stream:
                          result = subprocess.run(argv, stdout=stream, stderr=subprocess.STDOUT)
                      command_row = {"command": argv, "exit_code": result.returncode,
                                     "started_unix_seconds": started, "finished_unix_seconds": time.time(),
                                     "log_path": str(log), "log_sha256": hashlib.sha256(log.read_bytes()).hexdigest()}
                      file_row["commands"].append(command_row)
                      required_failures |= bool(result.returncode)
                  current = candidate.read_bytes()
                  file_row.update({"after_sha256": hashlib.sha256(current).hexdigest(),
                                   "before_bytes": len(canonical_originals[name]), "after_bytes": len(current),
                                   "changed": current != canonical_originals[name],
                                   "canonical_check_passed": len(file_row["commands"]) == 2 and not any(row["exit_code"] for row in file_row["commands"])})
          except Exception as error:
              canonical_receipt["producer_error"] = str(error)
              required_failures = True
          finally:
              try:
                  canonical_receipt["compiler_unchanged"] = hashlib.sha256(compiler.read_bytes()).hexdigest() == compiler_hash
                  canonical_receipt["committed_inputs_restored"] = all(pathlib.Path(name).read_bytes() == before for name, before in canonical_originals.items())
              except OSError as error:
                  canonical_receipt["restoration_check_error"] = str(error)
                  canonical_receipt["compiler_unchanged"] = False
                  canonical_receipt["committed_inputs_restored"] = False
              canonical_receipt["success"] = (not canonical_receipt.get("producer_error") and
                  canonical_receipt["compiler_unchanged"] and canonical_receipt["committed_inputs_restored"] and
                  len(canonical_receipt["files"]) == len(canonical_originals) and
                  all(row.get("canonical_check_passed", False) for row in canonical_receipt["files"]))
              receipt_path = canonical_dir / "receipt.json"
              receipt_path.write_text(json.dumps(canonical_receipt, indent=2) + "\n")
              rows.append({"canonical_source_producer": True, "exit_code": 0 if canonical_receipt["success"] else 1,
                           "receipt_path": str(receipt_path), "receipt_sha256": hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
                           "selected_sources": len(canonical_originals), "evidence_only": True})
              required_failures |= not canonical_receipt["success"]
          if producer_only:
              # Producers retain candidates, then restore the frozen inputs.
              # This successful evidence run is never owning-check qualification.
              pins_restored = all(pathlib.Path(name).read_bytes() == (before_dir / name).read_bytes() for name in pin_paths)
              pin_check = subprocess.run(["git", "diff", "--exit-code", "--", *pin_paths], capture_output=True)
              pins_restored = pins_restored and pin_check.returncode == 0
              if not pins_restored:
                  (out / "producer-pin-restoration-error.log").write_bytes(pin_check.stdout + pin_check.stderr)
              failed = required_failures or not pins_restored or not canonical_receipt["success"]
              if canonical_only:
                  failed |= len(rows) != 2 or len(canonical_originals) != len(binding["canonical_inventory"]["files"])
              (out / "results.json").write_text(json.dumps({
                  "source_subject": subject,
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "compiler_path": str(compiler), "compiler_sha256": compiler_hash,
                  "profile": "canonical" if canonical_only else "produce", "qualification": False, "owner_checks_executed": False,
                  "pins_restored": pins_restored, "full_gates": False, "cargo_jobs": 1, "rows": rows,
              }, indent=2) + "\n")
              with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("required_passed=false\n")
              raise SystemExit(int(failed))
          if not canonical_receipt["compiler_unchanged"] or not canonical_receipt["committed_inputs_restored"]:
              raise RuntimeError("canonical producer drift: refusing owning checks against changed inputs")
          failed_harnesses = {}
          for i, command in enumerate(commands):
              harness_key = None
              if command[0] == "cargo" and command[1] == "test":
                  package = command[command.index("-p") + 1] if "-p" in command else "workspace"
                  if "--test" in command:
                      harness_key = (package, "test", command[command.index("--test") + 1])
                  elif "--bin" in command:
                      harness_key = (package, "bin", command[command.index("--bin") + 1])
                  elif "--lib" in command:
                      harness_key = (package, "lib")
              if harness_key in failed_harnesses:
                  blocked = {"command": command, "exit_code": 125,
                             "not_executed": True, "selected_observed": 0,
                             "blocked_by_harness_compile_log": failed_harnesses[harness_key]}
                  log = out / f"{i:02}.log"
                  log.write_text("NOT EXECUTED: owning harness compilation failed; retained cause=" + failed_harnesses[harness_key] + "\n")
                  blocked.update({"log_path": log.name, "log_sha256": hashlib.sha256(log.read_bytes()).hexdigest(),
                                  "expected_selected": expected_checks[i]["expected_selected"], "selected_count_mismatch": True})
                  rows.append(blocked)
                  required_failures = True
                  (out / "results.json").write_text(json.dumps({
                      "source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                      "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                      "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
                  print("NOT EXECUTED: owning harness already failed compilation", blocked, flush=True)
                  continue
              if command[1] == "test":
                  if "--" not in command:
                      command.extend(["--", "--test-threads=1"])
                  elif "--test-threads=1" not in command:
                      command.append("--test-threads=1")
              log = out / f"{i:02}.log"
              started = time.monotonic()
              print("START", i, " ".join(command), flush=True)
              with log.open("wb") as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              row = {"command": command, "exit_code": result.returncode,
                     "seconds": round(time.monotonic() - started, 3), "log_path": log.name,
                     "log_sha256": hashlib.sha256(data).hexdigest()}
              if command[1] == "test":
                  summaries = re.findall(
                      rb"(?m)^test result: (?:ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed(?:; ([0-9]+) ignored)?(?:;|,)",
                      data,
                  )
                  row["selected_passed"] = sum(int(summary[0]) for summary in summaries)
                  row["selected_observed"] = sum(
                      int(summary[0]) + int(summary[1]) for summary in summaries
                  )
                  if not row["selected_observed"]:
                      row["zero_selected_error"] = True
              expected = expected_checks[i]
              if command != expected["command"]:
                  raise RuntimeError("owning argv drift")
              row["expected_selected"] = expected["expected_selected"]
              if command[1] == "test":
                  row["selected_failed"] = sum(int(summary[1]) for summary in summaries)
                  row["nonzero_passed_error"] = not row.get("selected_passed")
                  row["selected_failure_error"] = bool(row["selected_failed"])
              if row.get("expected_selected") is not None:
                  row["selected_count_mismatch"] = row.get("selected_observed") != row["expected_selected"]
              if "rendered_document_has_literal_sha_exact_wire_order_and_digest_binding" in command:
                  graph_wire_pin_failed = bool(result.returncode or row.get("zero_selected_error"))
              required_failures |= bool(result.returncode or row.get("zero_selected_error") or row.get("selected_count_mismatch") or row.get("nonzero_passed_error") or row.get("selected_failure_error"))
              rows.append(row)
              (out / "results.json").write_text(json.dumps({
                  "source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
              print("DONE", i, row, flush=True)
              if result.returncode or row.get("zero_selected_error") or row.get("selected_count_mismatch") or row.get("nonzero_passed_error") or row.get("selected_failure_error"):
                  print(data.decode(errors="replace")[-4000:], flush=True)
              if b"could not compile" in data or b"error[E" in data:
                  if harness_key is None:
                      break
                  failed_harnesses[harness_key] = log.name
          if graph_wire_pin_failed:
              command = ["cargo", "test", "--locked", "--offline", "-p", "semaprax", "--lib",
                         "workspace_graph::type_proof_tests::projection_tests::emit_projection_wire_pin_candidate",
                         "--", "--ignored", "--nocapture", "--test-threads=1"]
              log = out / "graph-wire-candidate-producer.log"
              print("START conditional owning graph-wire candidate producer", flush=True)
              with log.open("wb") as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
              data = log.read_bytes()
              selected = sum(map(int, re.findall(rb"test result: ok\. ([0-9]+) passed", data))) if result.returncode == 0 else 0
              rows.append({"command": command, "exit_code": result.returncode, "selected_passed": selected,
                           "expected_selected": 1, "selected_count_mismatch": selected != 1,
                           "log_sha256": hashlib.sha256(data).hexdigest(), "conditional_on_wire_pin_failure": True})
              (out / "results.json").write_text(json.dumps({"source_subject": __import__("os").environ["SOURCE_SUBJECT"],
                  "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "full_gates": False, "cargo_jobs": 1, "rows": rows}, indent=2) + "\n")
          # The candidate producer is evidence only and can never convert a failed literal pin into success.
          failed = required_failures or len(rows) < len(commands)
          generated = subprocess.run(["git", "diff", "--exit-code", "--", *pin_paths], capture_output=True)
          if generated.returncode:
              failed = True
              (out / "generated-source-diff.log").write_bytes(generated.stdout + generated.stderr)
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required_passed={'false' if failed else 'true'}\n")
          sys.exit(int(failed))
          PYCODE
      - name: Offline 49-case qualification of both original matcher adapters
        if: steps.focused.outputs.required_passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYQUAL'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, sys, tempfile, time
          root = Path.cwd().resolve(); out = Path("focused-evidence"); out.mkdir(exist_ok=True)
          compiler = root / "target/opt-focused-706-709/debug/semaprax"
          sys.path.insert(0, str(root / "benchmarks/cli-tokens-v1"))
          import live_campaign
          settings = {"round": 6, "qualification": live_campaign.qualification.metadata(),
                      "seed_files_sha256": live_campaign.ROUND_SEED_SHA256[6]}
          live_campaign.qualification.require_settings(settings)
          env = live_campaign.trial_environment(compiler); env["SEMAPRAX_BIN"] = str(compiler)
          node = subprocess.check_output(["node", "--version"], text=True, env=env).strip()
          assert node == "v24.3.0", node
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          inventory = lambda d: {str(p.relative_to(d)): sha(p) for p in sorted(d.rglob("*")) if p.is_file()}
          compiler_before = sha(compiler); rows = []
          for variant in ("matcher-adapted", "matcher-package-adapted"):
              source = root / "experiments/ascii-pattern-source/loglens-reference" / variant
              assert not any(p.is_symlink() for p in source.rglob("*"))
              candidate = Path(tempfile.mkdtemp(prefix="spx-loglens-", dir=os.environ["RUNNER_TEMP"])).resolve() / "candidate"
              shutil.copytree(source, candidate); source_files = inventory(source)
              assert inventory(candidate) == source_files
              sample = root / "benchmarks/cli-tokens-v1/sample.log"
              shutil.copy2(sample, candidate.parent / "sample.log"); assert sha(candidate.parent / "sample.log") == sha(sample)
              evidence = out / variant; assert not evidence.exists(), "qualification evidence must be fresh"
              started = time.monotonic()
              result = live_campaign.check_program_for_campaign(candidate, 240, env, settings, "semaprax", evidence)
              row = {"variant": variant, "source_files_sha256": source_files,
                     "sibling_sample_sha256": sha(sample), "compiler_sha256": compiler_before,
                     "source_subject": os.environ["SOURCE_SUBJECT"],
                     "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                     "node_version": node, "seconds": round(time.monotonic() - started, 3),
                     "qualification_result": result, "model_dispatch": "none"}
              if (candidate / "loglens").is_file(): row["native_binary_sha256"] = sha(candidate / "loglens")
              (out / f"{variant}-receipt.json").write_text(json.dumps(row, indent=2) + "\n")
              rows.append(row); print(json.dumps(row, indent=2), flush=True)
              assert sha(compiler) == compiler_before, "compiler changed during qualification"
              shutil.rmtree(candidate.parent)
          (out / "adapter-results.json").write_text(json.dumps(rows, indent=2) + "\n")
          sys.exit(0 if all(row["qualification_result"].get("accepted") is True for row in rows) else 1)
          PYQUAL
      - name: Preserve focused verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opt-focused-next-batch
          path: focused-evidence/
          retention-days: 7
      - name: Save private hosted Cargo intermediates
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/opt-focused-706-709
          key: opt-focused-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}

  macos-compiler:
    if: ${{ inputs.profile == 'macos-compiler' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SOURCE_SUBJECT: ${{ inputs.source_subject }} # exact joined source fc9e5090daffaada9cdb738a410cd3ae92577785
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      WORKFLOW_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: target/opt-focused-macos-compiler
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_subject }}
          fetch-depth: 1
          lfs: false
      - name: Require successful grouped verification for the exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$VERIFICATION_RUN_ID"
          [[ "$SOURCE_SUBJECT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SUBJECT" == "fc9e5090daffaada9cdb738a410cd3ae92577785" ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SUBJECT"
          gh run view "$VERIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json name,event,status,conclusion,headSha > prior-run.json
          python3 - "$SOURCE_SUBJECT" prior-run.json <<'PYCODE'
          import json, sys
          source, path = sys.argv[1:]
          run = json.load(open(path))
          if (run.get("name") != "Focused canonical source repair" or
              run.get("event") != "workflow_dispatch" or
              run.get("status") != "completed" or run.get("conclusion") != "success"):
              raise SystemExit("verification run is not the successful focused workflow")
          if run.get("headSha") != __import__("os").environ["WORKFLOW_SHA"]:
              raise SystemExit("verification used a different workflow commit")
          PYCODE
      - name: Retrieve and verify prior focused evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opt-focused-next-batch
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: verification-evidence
      - name: Bind prior evidence to source and workflow run
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SUBJECT" prior-run.json verification-evidence/results.json verification-evidence/adapter-results.json <<'PYCODE'
          import json, sys
          source, run_path, result_path, adapters_path = sys.argv[1:]
          if source != "fc9e5090daffaada9cdb738a410cd3ae92577785": raise SystemExit("macOS source binding mismatch")
          run = json.load(open(run_path)); result = json.load(open(result_path))

# Isolated historical compiler build; application qualification is separate.
# Separate historical baseline route; never reuse the current macos-compiler gate.
name: Historical Catalog v30 compiler build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-catalog-v30-build-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  historical-catalog-v30-compiler:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HISTORICAL_SOURCE: e0b633ff27079ceb02a86fc5c8914e88cd959e0e
      HISTORICAL_TREE: 70f95fdfb4b02a57ec5d272cdb285ab41e00edaf
      HISTORICAL_LOCK_SHA256: 7549892c22d2e25ecd2d7c2082456b5b1e80e300c4ee8d10fb988f5534da2046
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing v7 pin
        with:
          ref: e0b633ff27079ceb02a86fc5c8914e88cd959e0e
          path: historical-source
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # existing pin
        with:
          toolchain: 1.97.1
      - name: Historical binary build with separate bootstrap and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUILD'
          import hashlib, json, os, pathlib, platform, shutil, subprocess, sys, time
          root = (pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "historical-source").resolve()
          out = root.parent / "historical-catalog-v30-artifact"
          out.mkdir(exist_ok=False)
          target = root / "target" / "historical-catalog-v30-private"
          cargo_home = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("historical-catalog-cargo-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          cargo_home.mkdir(exist_ok=False)
          env = dict(os.environ, CARGO_TARGET_DIR=str(target), CARGO_HOME=str(cargo_home))
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          text = lambda argv: subprocess.check_output(argv, cwd=root, env=env, text=True)
          command = ["cargo", "build", "--locked", "--offline", "-p", "semaprax", "--bin", "semaprax"]
          identity = {
              "schema": "semaprax.catalog-historical-compiler-identity.v1",
              "role": "historical_catalog_v30_baseline_candidate",
              "application_qualified": False, "original23_status": "not_run",
              "verification_run_id": None, "owning_verification_proof": False,
              "compiler_source_commit": text(["git", "rev-parse", "HEAD"]).strip(),
              "compiler_source_tree": text(["git", "rev-parse", "HEAD^{tree}"]).strip(),
              "source_status_before": text(["git", "status", "--porcelain=v1", "--untracked-files=all"]),
              "cargo_lock_sha256_before": sha(root / "Cargo.lock"),
              "workflow_sha": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "host": {"system": platform.system(), "release": platform.release(), "version": platform.version(), "machine": platform.machine()},
              "rustc_vv": text(["rustc", "-Vv"]), "cargo_version": text(["cargo", "--version"]),
              "clang_version": text(["clang", "--version"]), "sw_vers": text(["sw_vers"]),
              "build_command": command,
              "build_environment": {k: env[k] for k in ["CARGO_TARGET_DIR", "CARGO_HOME", "CARGO_BUILD_JOBS", "CARGO_INCREMENTAL", "CARGO_PROFILE_DEV_DEBUG", "CARGO_TERM_COLOR"]},
              "bootstrap_command": ["cargo", "fetch", "--locked"],
              "bootstrap_network_allowed": True, "build_offline": True,
              "full_gates": False, "library_test_compile": False, "clippy": False,
              "status": "source_binding_pending"
          }
          save = lambda: (out / "identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          save()
          if (identity["compiler_source_commit"] != env["HISTORICAL_SOURCE"] or
              identity["compiler_source_tree"] != env["HISTORICAL_TREE"] or
              identity["source_status_before"] or
              identity["cargo_lock_sha256_before"] != env["HISTORICAL_LOCK_SHA256"] or
              identity["host"]["system"] != "Darwin" or
              "host: aarch64-apple-darwin\n" not in identity["rustc_vv"]):
              identity["status"] = "source_or_host_binding_failed"; save(); sys.exit(1)
          def run(argv, log_name):
              log = out / log_name; started = time.monotonic()
              with log.open("xb") as stream:
                  result = subprocess.run(argv, cwd=root, env=env, stdout=stream, stderr=subprocess.STDOUT)
              return {"command": argv, "exit_code": result.returncode, "seconds": round(time.monotonic() - started, 3), "log": {"path": log.name, "sha256": sha(log)}}
          identity["bootstrap"] = run(identity["bootstrap_command"], "bootstrap.log")
          save()
          if identity["bootstrap"]["exit_code"]:
              identity["status"] = "bootstrap_failed"; save(); sys.exit(1)
          identity["build"] = run(command, "build.log")
          identity["source_status_after"] = text(["git", "status", "--porcelain=v1", "--untracked-files=all"])
          identity["cargo_lock_sha256_after"] = sha(root / "Cargo.lock")
          identity["source_commit_after"] = text(["git", "rev-parse", "HEAD"]).strip()
          identity["source_tree_after"] = text(["git", "rev-parse", "HEAD^{tree}"]).strip()
          good = (identity["build"]["exit_code"] == 0 and not identity["source_status_after"] and
                  identity["cargo_lock_sha256_after"] == identity["cargo_lock_sha256_before"] and
                  identity["source_commit_after"] == identity["compiler_source_commit"] and
                  identity["source_tree_after"] == identity["compiler_source_tree"])
          identity["status"] = "built_unqualified_historical_candidate" if good else "build_or_source_binding_failed"
          if good:
              binary = out / "semaprax"
              shutil.copy2(target / "debug" / "semaprax", binary)
              identity["compiler_binary_sha256"] = sha(binary)
              identity["compiler_binary_size_bytes"] = binary.stat().st_size
              receipt = {"schema": "semaprax.loglens.compiler-build.v1",
                         "compiler_source_commit": identity["compiler_source_commit"],
                         "compiler_binary_sha256": identity["compiler_binary_sha256"],
                         "build_command": command, "build_log": identity["build"]["log"]}
              receipt_path = out / "compiler-build.json"
              receipt_path.write_text(json.dumps(receipt, indent=2) + "\n")
              identity["compiler_build_receipt_sha256"] = sha(receipt_path)
          save()
          sys.exit(0 if good else 1)
          PYBUILD
      - name: Retain historical baseline build evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # existing v4 pin
        with:
          name: historical-catalog-v30-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: historical-catalog-v30-artifact/
          if-no-files-found: error
          retention-days: 30

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
          arguments: --workspace --all-features --locked

  component-runtime-v3:
    name: Private Wasmtime Component result runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Audit the isolated Component runtime dependency graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
          manifest-path: platform-tests/component-runtime/Cargo.toml
          arguments: --config platform-tests/component-runtime/deny.toml --all-features --locked
      - name: Fetch dependencies, then execute every v3/v4/v5/v6/v7/v8/v9/v10 Component gate offline
        run: scripts/component-runtime-v3.sh

  verify:
    name: Rust ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Resolve the real held rustc image (Unix)
        if: runner.os != 'Windows'
        run: echo "RUSTC=$(rustup which rustc)" >> "$GITHUB_ENV"
      - name: Resolve the real held rustc image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTC=$(rustup which rustc)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve the authenticated Windows SDK and MSVC environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if not defined VCToolsInstallDir exit /b 1
          set "SEMAPRAX_VCTOOLS=%VCToolsInstallDir%"
          if "%SEMAPRAX_VCTOOLS:~-1%"=="\" set "SEMAPRAX_VCTOOLS=%SEMAPRAX_VCTOOLS:~0,-1%"
          set "SEMAPRAX_LINKER=%SEMAPRAX_VCTOOLS%\bin\Hostx64\x64\link.exe"
          if not exist "%SEMAPRAX_VCTOOLS%" exit /b 1
          if not exist "%SEMAPRAX_LINKER%" exit /b 1
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo SEMAPRAX_VCTOOLS=%SEMAPRAX_VCTOOLS%>>"%GITHUB_ENV%"
          echo SEMAPRAX_LINKER=%SEMAPRAX_LINKER%>>"%GITHUB_ENV%"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Require semantic-workspace change pre/post-pivot process termination evidence
        run: cargo test --locked -p semaprax --lib semantic_workspace_change::tests::semantic_change_apply_killed_process_boundaries_preserve_exact_old_or_new -- --exact --nocapture
      - name: Require structural-change pre/post-pivot process termination evidence
        run: cargo test --locked -p semaprax --lib semantic_workspace_structural_change::tests::structural_apply_killed_process_boundaries_preserve_exact_old_or_new -- --exact --nocapture
      - name: Require semantic-workspace Operations pre/post-pivot process termination evidence
        run: cargo test --locked -p semaprax --lib semantic_workspace_operations::tests::operations_apply_killed_process_boundaries_preserve_exact_old_or_new -- --exact --nocapture
      - name: Require private bounded Agent Runtime deterministic fake-host evidence
        run: cargo test --locked -p semaprax --lib agent_runtime::tests -- --nocapture
      - name: Require public bounded Agent Runtime injected-host evidence
        run: cargo test --locked -p semaprax --test agent_runtime_v1 -- --nocapture
      - name: Require private Economic Agent deterministic fake-host evidence
        run: cargo test --locked -p semaprax --lib economic_agent::tests -- --nocapture
      - name: Require private Economic Agent durable marker process-termination evidence
        run: cargo test --locked -p semaprax --lib economic_agent::tests::economic_process_kill_markers_never_repeat_sign_or_broadcast -- --exact --nocapture
      - name: Require public Economic Agent injected-host evidence
        run: cargo test --locked -p semaprax --test economic_agent_v1 -- --nocapture
      - name: Require private Native Rust Interop language, HIR, Graph, and Wasm preservation evidence
        run: |
          cargo test --locked -p semaprax --test native_rust_interop_v1 -- --nocapture
          cargo test --locked -p semaprax --test native_rust_interop_ci_contract -- --nocapture
      - name: Require private Native Rust Interop A+B replay, static-link, runtime, and hostile evidence
        run: cargo test --locked -p semaprax-native-rust-interop -- --nocapture
      - name: Require private Native Rust Interop platform authority evidence
        run: cargo test --locked -p semaprax-native-rust-interop-platform --all-targets -- --nocapture
      - name: Require Windows callable-v2 and private callable-v3 physical evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang --version
          cargo test --locked -p semaprax-native-loader --test runtime_loader_windows windows_callable_dependency_search_excludes_cwd_and_legacy_path -- --exact
          cargo test --locked -p semaprax-native-host --test runtime_callable_corpus authoritative_corpus_executes_through_generated_callable_host_at_o0_and_o2 -- --exact
          cargo test --locked -p semaprax --lib codegen::native_callable_provider_v3::tests::authoritative_fourteen_case_graph_providers_execute_and_settle_at_o0_o2 -- --exact
          cargo test --locked -p semaprax --lib codegen::native_callable_provider_v3::tests::physical_failure_injection_and_durable_settlement_boundaries_are_exact_at_o0_o2 -- --exact
          cargo test --locked -p semaprax-native-host --lib settlement_host_v3_integration::generated_provider_loader_host_v3_end_to_end_is_exact -- --exact
          cargo test --locked -p semaprax-native-host --lib settlement_host_v3_integration::generated_provider_loader_host_v3_physical_failures_are_durable_at_o0_o2 -- --exact
      - name: Package and execute private Windows desktop application
        if: runner.os == 'Windows'
        shell: pwsh
        run: platform-tests/desktop-native/package-windows.ps1 -OutputRoot "$env:RUNNER_TEMP/semaprax-private-desktop-v3"
      - name: Package and execute private macOS desktop application
        if: runner.os == 'macOS'
        run: platform-tests/desktop-native/package-macos.sh "$RUNNER_TEMP/semaprax-private-desktop-v3"
      - name: Package and execute private Windows native UI application
        if: runner.os == 'Windows'
        shell: pwsh
        run: platform-tests/desktop-native/package-ui-windows.ps1 -OutputRoot "$env:RUNNER_TEMP/semaprax-private-desktop-ui-v1" -EngineRoot "$env:RUNNER_TEMP/semaprax-private-desktop-v3"
      - name: Package and execute private macOS native UI application
        if: runner.os == 'macOS'
        run: platform-tests/desktop-native/package-ui-macos.sh "$RUNNER_TEMP/semaprax-private-desktop-ui-v1" "$RUNNER_TEMP/semaprax-private-desktop-v3"
      - name: Require native cleanup sanitizers (Linux)
        if: runner.os == 'Linux'
        env:
          SEMAPRAX_REQUIRE_NATIVE_SANITIZERS: "1"
        run: |
          cargo test --locked -p semaprax --lib codegen::native_conformance::first_native_resource_corpus_matches_the_reference_across_codegen_modes -- --exact
          cargo test --locked -p semaprax --lib codegen::tests::callable_v2_integrated_scalar_owned_success_failure_are_o0_o2_exact -- --exact
      - name: Require private callable-v3 provider sanitizers (Linux)
        if: runner.os == 'Linux'
        env:
          CLANG: clang
          SEMAPRAX_REQUIRE_CALLABLE_V3_SANITIZERS: "1"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cargo test --locked -p semaprax --lib codegen::native_callable_provider_v3::tests::authoritative_fourteen_case_graph_providers_execute_and_settle_at_o0_o2 -- --exact
          cargo test --locked -p semaprax --lib codegen::native_callable_provider_v3::tests::physical_failure_injection_and_durable_settlement_boundaries_are_exact_at_o0_o2 -- --exact
      - name: Require private Native Rust Interop ASan + UBSan round trip (Linux)
        if: runner.os == 'Linux'
        env:
          SEMAPRAX_REQUIRE_NATIVE_RUST_INTEROP_SANITIZERS: "1"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cargo test --locked -p semaprax-native-rust-interop --lib implementation::tests::linked_bridge_round_trips_rust_to_semaprax_to_rust_and_closes_failures -- --exact --nocapture
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --workspace --release
      - run: cargo run --locked -p semaprax -- check examples/meaning.spx
      - run: cargo run --locked -p semaprax -- check examples/ownership.spx
      - run: cargo run --locked -p semaprax -- check examples/lifecycle.spx
      - run: cargo run --locked -p semaprax -- check examples/control_flow.spx
      - run: cargo run --locked -p semaprax -- check examples/records.spx
      - run: cargo run --locked -p semaprax -- check examples/native_callable.spx
      - run: cargo run --locked -p semaprax -- fmt examples/meaning.spx --check
      - run: cargo run --locked -p semaprax -- fmt examples/effects.spx --check
      - run: cargo run --locked -p semaprax -- fmt examples/ownership.spx --check
      - run: cargo run --locked -p semaprax -- fmt examples/lifecycle.spx --check
      - run: cargo run --locked -p semaprax -- fmt examples/control_flow.spx --check
      - run: cargo run --locked -p semaprax -- fmt examples/records.spx --check
      - run: cargo run --locked -p semaprax -- fmt examples/native_callable.spx --check
      - name: Build public native-callable bundle
        run: cargo run --locked -p semaprax -- build examples/native_callable.spx --target native-callable --function example.token.identity -o target/native-callable-example
      - name: Build and run native example (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo run --locked -p semaprax -- build examples/control_flow.spx -o target/control-flow
          test "$(target/control-flow)" = "42"
      - name: Build and run native example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --locked -p semaprax -- build examples/control_flow.spx -o target/control-flow.exe
          $result = & target/control-flow.exe
          if ($result -ne "42") { throw "expected 42, received $result" }
      - run: cargo run --locked -p semaprax -- build examples/control_flow.spx --target web -o target/control-flow-web
      - run: node scripts/verify-web.mjs target/control-flow-web
      - name: Verify publishable crate
        if: runner.os == 'Linux'
        run: cargo package --locked -p semaprax

  ios-static-cross-check:
    name: Private iOS static loader + host runtime
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-ios-macabi,x86_64-apple-ios-macabi
      - name: Require every private iOS static target to compile
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios \
            aarch64-apple-ios-macabi \
            x86_64-apple-ios-macabi
          do
            cargo check --locked -p semaprax-native-loader --target "$target" --all-targets
            cargo check --locked -p semaprax-native-host --target "$target" --all-targets
            loader_tree="$(cargo tree --locked -p semaprax-native-loader --target "$target" -e normal)"
            host_tree="$(cargo tree --locked -p semaprax-native-host --target "$target" -e normal)"
            if grep -q libloading <<<"$loader_tree" || grep -q libloading <<<"$host_tree"
            then
              echo "iOS static loader/host target unexpectedly resolved libloading: $target" >&2
              exit 1
            fi
          done
      - name: Run generated callable-v3 through the arm64 iOS Simulator
        shell: bash
        run: scripts/ios-simulator-v3.sh

  ios-swift-app-cross-check:
    name: Private Swift/iOS application + XCFramework runtime
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build and inspect the private device + Simulator XCFramework, then run the arm64 Swift application
        shell: bash
        run: scripts/ios-swift-app-v3.sh

  android-emulator-cross-check:
    name: Private Android dynamic loader + host runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-linux-android,aarch64-linux-android
      - name: Enable Android emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run generated callable-v3 through the x86_64 Android Emulator
        uses: ReactiveCircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          ndk: 27.2.12479018
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android-emulator-v3.sh

  android-jni-app-cross-check:
    name: Private Android JNI/Kotlin application runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-linux-android,aarch64-linux-android
      - name: Enable Android JNI emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build offline and run the private JNI/Kotlin instrumentation APK
        uses: ReactiveCircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          ndk: 27.2.12479018
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android-jni-app-v3.sh

  callable-host-sanitizers:
    name: Callable host ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
      SEMAPRAX_REQUIRE_CALLABLE_HOST_SANITIZERS: "1"
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      RUSTFLAGS: -C linker=clang -C link-arg=-fsanitize=address,undefined -C force-frame-pointers=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Require Clang sanitizer runtime
        run: |
          clang --version
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/sanitizer-probe.c"
          clang -fsanitize=address,undefined -fno-sanitize-recover=all "$RUNNER_TEMP/sanitizer-probe.c" -o "$RUNNER_TEMP/sanitizer-probe"
          "$RUNNER_TEMP/sanitizer-probe"
      - name: Run dynamically loaded callable-v2 and private callable-v3 paths under ASan and UBSan
        run: |
          cargo test --locked -p semaprax-native-host --test runtime_callable_corpus authoritative_corpus_executes_through_generated_callable_host_at_o0_and_o2 -- --exact
          cargo test --locked -p semaprax-native-host --lib settlement_host_v3_integration::generated_provider_loader_host_v3_end_to_end_is_exact -- --exact
          cargo test --locked -p semaprax-native-host --lib settlement_host_v3_integration::generated_provider_loader_host_v3_physical_failures_are_durable_at_o0_o2 -- --exact

  rust-host-address-sanitizer:
    name: Rust host ASan (nightly-2026-07-16)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      SEMAPRAX_REQUIRE_RUST_HOST_ASAN: "1"
      SEMAPRAX_RUST_HOST_ASAN_TOOLCHAIN: nightly-2026-07-16
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      RUSTFLAGS: -Zsanitizer=address -Zexternal-clangrt -Clinker=clang-18 -Clink-arg=-fsanitize=address -Cforce-frame-pointers=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-16
          components: rust-src
      - name: Require Rust-host AddressSanitizer instrumentation and execute real callables
        run: scripts/verify-rust-host-asan.sh

  msrv:
    name: Rust 1.85 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.85"
      - name: Resolve the real held rustc image (Unix)
        shell: bash
        run: echo "RUSTC=$(rustup which rustc)" >> "$GITHUB_ENV"
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets --all-features

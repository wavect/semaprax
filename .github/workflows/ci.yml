          failed = required_failures or len(rows) != len(commands) + 6
          generated = subprocess.run(["git", "diff", "--exit-code", "--", *pin_paths], capture_output=True)
          if generated.returncode:
              failed = True
              (out / "generated-source-diff.log").write_bytes(generated.stdout + generated.stderr)
          tracked = subprocess.run(["git", "diff", "--exit-code"], capture_output=True)
          (out / "terminal-tracked-diff.log").write_bytes(tracked.stdout + tracked.stderr)
          compiler_unchanged = hashlib.sha256(compiler.read_bytes()).hexdigest() == compiler_hash
          pins_restored = all(pathlib.Path(name).read_bytes() == (before_dir / name).read_bytes() for name in pin_paths)
          failed |= bool(tracked.returncode) or not compiler_unchanged or not pins_restored
          (out / "results.json").write_text(json.dumps({
              "source_subject": subject, "workflow_head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "profile": "verify", "qualification": False, "owner_checks_executed": True,
              "full_gates": False, "cargo_jobs": 1, "rows": rows,
              "expected_manifest_sha256": binding["expected_manifest_sha256"],
              "canonical_inventory_sha256": binding["canonical_inventory_sha256"],
              "pin_candidate_delta": pin_candidate_delta, "canonical_candidate_delta": canonical_candidate_delta,
              "pins_restored": pins_restored, "compiler_unchanged": compiler_unchanged,
              "compiler_sha256": compiler_hash, "tracked_inputs_unchanged": tracked.returncode == 0,
              "success": not failed, "owning_verification_passed": not failed,
          }, indent=2) + "\n")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"required_passed={'false' if failed else 'true'}\n")
          sys.exit(int(failed))
          PYCODE
      - name: Preserve focused verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: opt-grouped-successor
          path: focused-evidence/
          retention-days: 7
      - name: Save private hosted Cargo intermediates
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/grouped-successor-focused
          key: opt-grouped-ubuntu24-rust1971-debug0-v1-${{ inputs.source_subject }}

name: v0.4.0 documentation status reconciliation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-v040-final-reconcile.yml']

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile remaining implemented v0.4.0 documentation statuses
        shell: python
        run: |
          from pathlib import Path

          targets = {
              'APPLE-SWIFT-OWNERSHIP-V1.md',
              'ANDROID-JNI-OWNERSHIP-V1.md',
              'BOUNDED-LANGUAGE-NETWORK-IO-V1.md',
              'CANONICAL-COMMENTS-V1.md',
              'CANONICAL-SEMANTIC-WORKSPACE-REVISION-V1.md',
              'CLI-HELP-V1.md',
              'CLI-HELP-V3.md',
              'CLI-HELP-V4.md',
              'CONTRACTS-AND-TESTS-FACTS-V1.md',
              'DOC-PROJECTION-V1.md',
              'EXPLICIT-MUTATION-V1.md',
              'FIELD-MUTATION-V1.md',
              'CLASS-INHERITANCE-V1.md',
              'IMAGE-AGENT-APPLICATION-ERROR-DATA-V1.md',
              'IMAGE-PACKAGED-TYPESCRIPT-WORKFLOW-SDK-V1.md',
              'IMAGE-SUPPORTED-PRODUCT-WORKFLOW-V1.md',
              'INTERPRETER-INTERNAL-STRINGS-V1.md',
              'LANGUAGE-NATIVE-AGENT-SYNTAX-V1.md',
              'NATIVE-OWNED-DATA-STRING-SETTLEMENT-V1.md',
              'NATIVE-RUST-INTEROP-V1.md',
              'NATIVE-SCRATCH-V1.md',
              'NEW-PROJECT-STANDALONE-V1.md',
              'OWNED-NPM-INVOCATION-V1.md',
              'PACKAGE-MANIFEST-V1.md',
              'PORTABLE-INDEXED-BYTE-DATA-V1.md',
              'PROGRAM-ROOT-V3.md',
              'PROGRAM-ROOT-DEPENDENCY-LOCK-ASSOCIATION-V1.md',
              'PROJECT-AGENT-TRANSPORT-V6.md',
              'PROJECT-AGENT-TRANSPORT-V6-SDK-V1.md',
              'PROJECT-CANDIDATE-ANALYSIS-RUNTIME-EVIDENCE-V1.md',
              'PROJECT-CANDIDATE-ANALYSIS-ARTIFACT-EVIDENCE-V1.md',
              'PROJECT-CANDIDATE-GIT-PUBLICATION-V1.md',
              'PROJECT-CANDIDATE-PACKAGE-CONSUMER-MIGRATION-V1.md',
              'PROJECT-CANDIDATE-PUBLICATION-V1.md',
              'PROJECT-EXTRACTION-V1.md',
              'PROJECT-GRAPH-OPERATIONAL-WORKFLOW-V1.md',
              'PROJECT-MANIFEST-V1.md',
              'PROJECT-OWNING-CAPTURE-EXTRACTION-V1.md',
              'PROJECT-RECORD-FIELD-CHANGE-V1.md',
              'PROJECT-REVISION-STORE-V1.md',
              'PROJECT-REVISION-STORE-WINDOWS-V1.md',
              'PROJECT-SCAFFOLD-V2.md',
              'PROJECT-SCAFFOLD-V3.md',
              'PROJECT-V8-PROMOTION-RECEIPT-V1.md',
              'PUBLIC-FLAT-OWNED-RECORD-CXX-ADAPTER-V1.md',
              'PUBLIC-SCALAR-WIT-INTERFACE-V1.md',
              'SHARED-LOAN-PLAN-V1.md',
              'NESTED-OWNED-BYTE-RECORDS-V1.md',
              'NESTED-OWNED-RECORD-DESTRUCTURING-V1.md',
              'NESTED-OWNED-RECORD-UPDATE-V1.md',
              'UNIFIED-CLI-V1.md',
              'UNIVERSAL-SEMANTIC-QUERY-V1.md',
              'UNIVERSAL-SEMANTIC-TRANSACTION-V1.md',
              'UNIVERSAL-SEMANTIC-TRANSACTION-V2.md',
              'UNIVERSAL-SEMANTIC-WORKFLOW-CLI-V1.md',
              'PERSISTENT-INCREMENTAL-SEMANTIC-SERVICE-V1.md',
              'PERSISTENT-SEMANTIC-SERVICE-TRANSPORT-V1.md',
              'PERSISTENT-SEMANTIC-SERVICE-MCP-V1.md',
              'VSCODE-SAVED-SOURCE-ADAPTER-V1.md',
              'WASM-INTERNAL-STRINGS-V1.md',
              'WASM-INTERNAL-STRINGS-WEB-V1.md',
          }

          replacement = [
              'Status: implemented bounded profile; **HOSTED GREEN** under the',
              '[v0.4.0 release baseline](RELEASE-0.4.0-STATUS.md). Historical local,',
              'authoring-time, ignored, device/simulator, or separately provisioned evidence',
              'below retains its narrower scope; public promotion, registry publication and',
              'broader product completion remain separately gated.',
          ]

          changed = []
          for name in sorted(targets):
              path = Path('docs') / name
              if not path.is_file():
                  raise SystemExit(f'missing target: {name}')
              text = path.read_text(encoding='utf-8')
              if 'HOSTED GREEN' in '\n'.join(text.splitlines()[:20]):
                  continue
              lines = text.splitlines()
              idx = next((i for i, line in enumerate(lines[:24]) if line.startswith('Status:')), None)
              if idx is None:
                  raise SystemExit(f'no Status in first 24 lines: {name}')
              end = idx + 1
              while end < len(lines) and lines[end].strip() and not lines[end].startswith('Audience:'):
                  end += 1
              lines[idx:end] = replacement
              path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')
              changed.append(name)

          failures = []
          for name in sorted(targets):
              text = (Path('docs') / name).read_text(encoding='utf-8')
              first = text.splitlines()[:12]
              if not any(line.startswith('Status:') for line in first):
                  failures.append((name, 'Status'))
              if not any(line.startswith('Audience:') for line in first):
                  failures.append((name, 'Audience'))
              if 'HOSTED GREEN' not in '\n'.join(text.splitlines()[:20]):
                  failures.append((name, 'HOSTED GREEN'))
          if failures:
              raise SystemExit(f'metadata failures: {failures}')

          print(f'changed {len(changed)} docs')
          for name in changed:
              print(name)
      - name: Commit reconciled documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: reconcile remaining v0.4.0 implementation statuses'
          git pull --rebase origin main
          git push origin HEAD:main

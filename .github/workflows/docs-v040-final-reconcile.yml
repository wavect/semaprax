name: v0.4.0 documentation status reconciliation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-v040-final-reconcile.yml']

permissions:
  contents: read

jobs:
  audit-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact tracked source for documentation audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-audit-snapshot"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-audit-snapshot/COMMIT"
          git rev-parse 'v0.4.0^{commit}' > "$RUNNER_TEMP/docs-audit-snapshot/RELEASE-COMMIT"
          git ls-tree -r HEAD > "$RUNNER_TEMP/docs-audit-snapshot/TRACKED-TREE.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/docs-audit-snapshot/repository.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/docs-audit-snapshot/repository.tar.gz"
      - name: Upload exact audit snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semaprax-v040-documentation-audit-source
          path: ${{ runner.temp }}/docs-audit-snapshot/
          if-no-files-found: error
          retention-days: 3

name: v0.4.0 documentation status reconciliation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-v040-final-reconcile.yml']

permissions:
  contents: write

jobs:
  reconcile-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile final current implementation pages
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = {
              'AGENT-PAYMENT-HARNESS-V1.md',
              'AGENT-PROPOSAL-RUNTIME-V1-COMPATIBILITY-V1.md',
              'AGENT-TRANSPORT-V1.md',
              'AUTOMATIC-CANDIDATE-DRAFT-LIFECYCLE-V1.md',
              'BOUNDED-STDOUT-TRANSCRIPT-V1.md',
              'CLI-HELP-V2.md',
              'DOCTOR-OFFLINE-BUNDLE-V1.md',
              'DOCTOR-OFFLINE-WORKER-V1.md',
              'DOCTOR-SEALED-INPUT-V1.md',
              'EXACT-PROGRAM-CONTEXT-V1.md',
              'EXACT-PROGRAM-CONTEXT-V2.md',
              'EXPLICIT-AGENT-DEFINITION-ASSOCIATION-V1.md',
              'HTTPS-CLIENT-IO-V1.md',
              'HUMAN-DIAGNOSTICS-V1.md',
              'HYGIENIC-GEN-V1.md',
              'IMAGE-C-ARTIFACTS-V1.md',
              'IMAGE-SOURCE-COMMIT-PROTOCOL-V5.md',
              'IMAGE-SUPPORTED-WORKFLOW-RESPONSE-ACCOUNTABILITY-V1.md',
              'IMAGE-TYPED-RESPONSE-CLIENTS-V1.md',
              'INSTALLED-AGENT-GUIDANCE-V1.md',
              'INSTALLED-DIAGNOSTICS-V1.md',
              'INSTALLED-FIX-PLAN-V1.md',
              'INTERFACE-ARTIFACT-FACTS-V1.md',
              'LANGUAGE-NATIVE-AGENT-LOWERING-V1.md',
              'LANGUAGE-NATIVE-AGENT-OBJECT-V1.md',
              'NEW-PROJECT-PUBLICATION-V1.md',
              'OFFLINE-PACKAGE-COMPATIBILITY-EVIDENCE-V1.md',
              'OFFLINE-PACKAGE-RESOLVER-V1.md',
              'OFFLINE-PACKAGE-RESOLVER-V2.md',
              'OFFLINE-SEMANTIC-PACKAGE-LOCK-V3.md',
              'PACKAGE-REPORT-V2.md',
              'PROGRAM-ROOT-V1.md',
              'PROJECT-AGENT-TRANSPORT-V2.md',
              'PROJECT-CANDIDATE-ANALYSIS-COVERAGE-CHANGE-V1.md',
              'PROJECT-CANDIDATE-ANALYSIS-EVIDENCE-V1.md',
              'PROJECT-CANDIDATE-ENVIRONMENT-CONSUMER-REVIEW-V1.md',
              'PROJECT-CANDIDATE-FUNCTION-REFERENCE-REBIND-V1.md',
              'PROJECT-CANDIDATE-PACKAGE-CONSUMER-REPLAY-V1.md',
              'PROJECT-CANDIDATE-SYMBOL-DIAGNOSTICS-V1.md',
              'PROJECT-DEPENDENCIES-V1.md',
              'PROJECT-DEPENDENCY-RESOLUTION-V1.md',
              'PROJECT-GRAPH-OPERATIONAL-GIT-WORKFLOW-V1.md',
              'PROJECT-LOCK-V1.md',
              'PROJECT-MEMBER-RENAME-V1.md',
              'PROJECT-NOMINAL-RENAME-V1.md',
              'PROJECT-RENAME-TRANSACTION-V1.md',
              'PROJECT-SEMANTIC-CACHE-V1.md',
              'PROJECT-TARGET-CACHE-V1.md',
              'PROJECTED-OWNED-BYTES-BORROWED-CALL-V1.md',
              'SEMANTIC-IMAGE-CLEANUP-DEPENDENCIES-V1.md',
              'UNIVERSAL-SEMANTIC-TRANSACTION-COMPOSITION-V1.md',
          }

          replacement = [
              'Status: implemented bounded profile; **HOSTED GREEN** under the',
              '[v0.4.0 release baseline](RELEASE-0.4.0-STATUS.md). Historical local,',
              'authoring-time, ignored, physical/provisioned, benchmark, or exact-subject',
              'observations below retain their narrower scope. Public promotion, registry',
              'publication and broader product completion remain separately gated.',
          ]

          changed = []
          for name in sorted(targets):
              path = Path('docs') / name
              if not path.is_file():
                  raise SystemExit(f'missing target: {name}')
              text = path.read_text(encoding='utf-8')
              if 'HOSTED GREEN' in '\n'.join(text.splitlines()[:20]):
                  continue
              lines = text.splitlines()
              idx = next((i for i, line in enumerate(lines[:30]) if line.startswith('Status:')), None)
              if idx is None:
                  raise SystemExit(f'no Status in first 30 lines: {name}')
              end = idx + 1
              while end < len(lines) and lines[end].strip() and not lines[end].startswith('Audience:') and not lines[end].startswith('#'):
                  end += 1
              lines[idx:end] = replacement
              path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')
              changed.append(name)

          failures = []
          for name in sorted(targets):
              text = (Path('docs') / name).read_text(encoding='utf-8')
              first = text.splitlines()[:12]
              if not any(line.startswith('Status:') for line in first):
                  failures.append((name, 'Status'))
              if not any(line.startswith('Audience:') for line in first):
                  failures.append((name, 'Audience'))
              if 'HOSTED GREEN' not in '\n'.join(text.splitlines()[:20]):
                  failures.append((name, 'HOSTED GREEN'))
          if failures:
              raise SystemExit(f'metadata failures: {failures}')

          print(f'changed {len(changed)} docs')
          for name in changed:
              print(name)

          suspicious = re.compile(r'(?i)\b(authored|unrun|unhosted|locally?|pending|not run|not yet run|no hosted|hosted[^.\n]{0,40}(?:pending|required|open)|in progress)\b')
          rows = []
          for path in sorted(Path('docs').glob('*.md')):
              lines = path.read_text(encoding='utf-8').splitlines()
              idx = next((i for i, line in enumerate(lines[:30]) if line.startswith('Status:')), None)
              if idx is None:
                  continue
              end = idx + 1
              while end < len(lines) and lines[end].strip() and not lines[end].startswith('Audience:') and not lines[end].startswith('#'):
                  end += 1
              block = ' '.join(line.strip() for line in lines[idx:end])
              if suspicious.search(block) and 'HOSTED GREEN' not in block:
                  rows.append(f'{path.name}\t{block}')
          Path('status-audit.txt').write_text('\n'.join(rows) + ('\n' if rows else ''), encoding='utf-8')
          print(f'remaining suspicious status blocks: {len(rows)}')
      - name: Commit reconciled documentation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs; then
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs
            git commit -m 'docs: finish current v0.4.0 implementation status audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload remaining-status audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semaprax-v040-remaining-status-audit
          path: status-audit.txt
          if-no-files-found: error
          retention-days: 3

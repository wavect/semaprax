# Probe: can a GitHub-HOSTED runner satisfy the provisioned Linux doctor
# lifecycle gate's host preconditions?
#
# THIS IS A PROBE, NOT THE GATE. It never runs the 26 ignored lifecycle
# fixtures, never builds or packages the sealed current-head images, and a
# green result here is NOT a passing confinement result. Its only output is an
# honest per-requirement PASS/FAIL table for the host, so a maintainer can tell
# whether `.github/workflows/doctor-provisioned-linux.yml` needs a self-hosted
# runner at all. See issue #61 and
# docs/DOCTOR-PROVISIONED-LINUX-GATE-V1.md.
#
# Nothing here weakens a precondition. Every check below is the requirement the
# gate or its provisioning wrapper already states, observed rather than assumed.
name: Doctor hosted-runner probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/doctor-hosted-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    name: Hosted-runner precondition probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          lfs: false

      - name: Host facts
        run: |
          set -x
          uname -a
          cat /etc/os-release
          id
          python3 -VV
          stat -f -c '%T' /sys/fs/cgroup || true
          cat /proc/self/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          cat /sys/fs/cgroup/cgroup.subtree_control
          cat /proc/sys/user/max_user_namespaces || true
          cat /proc/sys/kernel/unprivileged_userns_clone || echo '(knob absent)'
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || echo '(knob absent)'
          command -v unshare && unshare --version
          sudo -n true && echo 'passwordless sudo: yes' || echo 'passwordless sudo: no'

      - name: Gate self-test (the gate's own fail-closed logic)
        run: python3 scripts/doctor-provisioned-linux-gate.py --self-test

      - name: Gate plan (the preconditions and exact selection)
        run: python3 scripts/doctor-provisioned-linux-gate.py --plan

      - name: Baseline - the gate on an unprovisioned hosted runner
        run: |
          set +e
          python3 scripts/doctor-provisioned-linux-gate.py \
            --evidence "$RUNNER_TEMP/baseline-evidence.json"
          echo "gate exit: $?"
          exit 0

      - name: Per-requirement host probe
        id: probe
        run: bash .github/probe/doctor-hosted-runner-probe.sh

      - name: Real distribution closure survey
        # The two real-distribution fixtures need actual Clang, Node and Rust
        # executables to run inside a pivoted read-only root. Measure the
        # loader closures before deciding how a bundle can carry them. This
        # measures; it packages nothing and proves nothing about confinement.
        run: |
          set -x
          rustup toolchain list
          rustup which rustc
          rustup target list --installed
          survey() {
            label="$1"; path="$2"
            echo "===== $label = $path ====="
            [ -e "$path" ] || { echo "(absent)"; return 0; }
            readlink -f "$path"
            file -L "$path" || true
            stat -Lc '%s bytes' "$path"
            ldd "$path" 2>&1 || true
            echo "--- closure ---"
            ldd "$path" 2>/dev/null \
              | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' \
              | sort -u | xargs -r stat -Lc '%s %n' \
              | awk '{t+=$1; print} END {print "TOTAL " t}'
          }
          survey clang "$(command -v clang || echo /nonexistent)"
          survey node "$(command -v node || echo /nonexistent)"
          survey rustc "$(rustup which rustc)"
          echo "===== rustc sysroot ====="
          du -sh "$(rustc --print sysroot)" || true
          ls -l "$(rustc --print sysroot)"/lib/*.so 2>/dev/null || true
          echo "===== host budget ====="
          df -h /
          nproc
          free -g

      - name: Real distribution byte budget
        # The wire format caps one bundle at 512 MiB and the loader resolves
        # every DT_NEEDED inside the pivoted root, so the bundle must carry the
        # whole closure. Measure whether three real distributions fit.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/budget"
          mkdir -p "$work"
          closure() {
            path="$1"
            printf '%s\n' "$(readlink -f "$path")"
            ldd "$path" 2>/dev/null \
              | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'
          }
          {
            closure /usr/bin/clang
            closure /usr/local/bin/node
            closure "$(rustup which rustc)"
          } | sort -u > "$work/files"
          wc -l < "$work/files"
          total=$(xargs -a "$work/files" stat -Lc '%s' | awk '{t+=$1} END {print t}')
          echo "UNSTRIPPED TOTAL BYTES: $total  (limit 536870912)"
          mkdir -p "$work/stripped"
          i=0
          while read -r f; do
            i=$((i+1))
            cp -L "$f" "$work/stripped/$i.bin"
            strip --strip-unneeded "$work/stripped/$i.bin" 2>/dev/null || true
          done < "$work/files"
          stotal=$(du -bc "$work/stripped" | tail -1 | awk '{print $1}')
          echo "STRIPPED TOTAL BYTES:   $stotal  (limit 536870912)"
          echo "--- per file, unstripped vs stripped ---"
          i=0
          while read -r f; do
            i=$((i+1))
            printf '%12s %12s %s\n' \
              "$(stat -Lc '%s' "$f")" "$(stat -c '%s' "$work/stripped/$i.bin")" "$f"
          done < "$work/files"

      - name: Candidate real distributions that fit the 512 MiB ceiling
        run: |
          set -uo pipefail
          measure() {
            label="$1"; shift
            tmp="$RUNNER_TEMP/m.$$"
            rm -rf "$tmp"; mkdir -p "$tmp"
            for p in "$@"; do
              [ -e "$p" ] || { echo "$label: MISSING $p"; return 0; }
              { readlink -f "$p"; ldd "$p" 2>/dev/null \
                | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'; }
            done | sort -u > "$tmp/files"
            n=0; tot=0
            while read -r f; do
              n=$((n+1))
              cp -L "$f" "$tmp/$n.bin" 2>/dev/null || continue
              strip --strip-unneeded "$tmp/$n.bin" 2>/dev/null || true
              tot=$((tot + $(stat -c '%s' "$tmp/$n.bin")))
            done < "$tmp/files"
            echo "$label: files=$n stripped_bytes=$tot"
            rm -rf "$tmp"
          }
          node --version; measure "node-runner" /usr/local/bin/node
          for v in 1.88.0 1.98.0; do
            rustup toolchain install "$v" --profile minimal --no-self-update \
              >/dev/null 2>&1 || { echo "rust-$v: install failed"; continue; }
            rbin="$(rustup which --toolchain "$v" rustc)"
            "$rbin" --version
            measure "rust-$v" "$rbin"
          done
          # Official LLVM release tarballs link LLVM statically into clang, so
          # the closure carries one copy of LLVM and no libxml2/ICU chain.
          cd "$RUNNER_TEMP"
          for spec in \
            "18.1.8:clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04" \
            "17.0.6:clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04" \
            "14.0.0:clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04"; do
            ver="${spec%%:*}"; name="${spec#*:}"
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/$name.tar.xz"
            rm -rf "llvm-$ver"; mkdir -p "llvm-$ver"
            curl -fsSL "$url" \
              | tar -xJ -C "llvm-$ver" --strip-components=2 \
                  --wildcards "*/bin/clang-*" 2>/dev/null \
              || { echo "llvm-$ver: download or extract failed"; continue; }
            bin="$(find "llvm-$ver" -maxdepth 1 -type f -name 'clang-*' | head -1)"
            [ -n "$bin" ] || { echo "llvm-$ver: no clang binary"; continue; }
            chmod +x "$bin"
            ls -l "$bin"; ldd "$bin" || true
            "$bin" --version || echo "llvm-$ver: cannot run on this host"
            measure "llvm-$ver-official-clang" "$bin"
            rm -rf "llvm-$ver"
          done
          echo "limit=536870912"

      - name: Evidence documents
        if: ${{ always() }}
        run: |
          for f in "$RUNNER_TEMP"/*evidence*.json; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done

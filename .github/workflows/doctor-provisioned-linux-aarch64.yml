# AArch64 Linux offline-doctor lifecycle tracking probe.
#
# This is intentionally separate from doctor-provisioned-linux.yml. The
# x86-64 gate's evidence must never be generalized to a second syscall ABI,
# and this job must never be treated as a signed-release gate: it runs the
# separately documented 26-case AArch64 lifecycle probe, whose two
# real-distribution fixtures run against real AArch64 Clang, Node and Rust
# carriers provisioned in the step before the offline run.
#
# The workflow is dispatch-only. It must not execute private provisioner work
# over arbitrary fork input, and any unmet native-host, namespace, dependency,
# carrier, or selected-fixture condition terminates the job nonzero. There is
# no continue-on-error or success-by-skip path: the driver runs all
# twenty-six fixtures and refuses without every real-carrier input.
name: Doctor AArch64 Linux lifecycle tracking

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-provisioned-linux-aarch64
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  doctor-provisioned-linux-aarch64:
    name: Linux AArch64 offline doctor lifecycle (real carriers)
    # This is the candidate's claimed execution environment, not evidence it
    # has run. The driver independently rejects every other architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          lfs: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.97.1

      - name: Require a native Linux AArch64 runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "expected native AArch64 runner, got $(uname -m)" >&2; exit 1 ;;
          esac

      - name: Acquire the locked dependency closure before offline execution
        run: cargo fetch --locked

      - name: Provision the real AArch64 Clang, Node and Rust carriers
        run: bash scripts/doctor-provisioned-linux-aarch64-carriers.sh "${{ runner.temp }}/doctor-aarch64-carriers"

      - name: Require the source bytes the tracking result binds
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Run the AArch64 lifecycle probe with real carriers
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/semaprax-doctor-aarch64-target
        run: bash scripts/doctor-provisioned-linux-aarch64-local-lifecycle.sh "${{ runner.temp }}/doctor-aarch64-carriers/carriers.env"

      - name: Preserve the explicit non-promotion boundary
        run: |
          set -euo pipefail
          printf '%s\n' \
            'This dispatch is the 26-case AArch64 lifecycle probe with real carriers, not a signed-release gate.' \
            'A result is AArch64 evidence only; it does not promote WP-05 or cover x86-64.'

# AArch64 Linux offline-doctor lifecycle tracking probe.
#
# This is intentionally separate from doctor-provisioned-linux.yml. The
# x86-64 gate's evidence must never be generalized to a second syscall ABI,
# and this job must never be treated as a full signed-release gate: it runs
# only the separately documented 24-case partial lifecycle probe. The two
# real-distribution cases remain explicit unresolved exclusions until a native
# real carrier and signed release path are added under their own review.
#
# The workflow is dispatch-only. It must not execute private provisioner work
# over arbitrary fork input, and any unmet native-host, namespace, dependency,
# or selected-fixture condition terminates the job nonzero. There is no
# continue-on-error or unannounced success-by-skip path: the driver carries
# exactly two documented real-distribution exclusions and two expected
# missing-precondition probes, each of which must fail.
name: Doctor AArch64 Linux lifecycle tracking

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-provisioned-linux-aarch64
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  doctor-provisioned-linux-aarch64:
    name: Linux AArch64 offline doctor lifecycle (partial tracking)
    # This is the candidate's claimed execution environment, not evidence it
    # has run. The driver independently rejects every other architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          lfs: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1

      - name: Require a native Linux AArch64 runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "expected native AArch64 runner, got $(uname -m)" >&2; exit 1 ;;
          esac

      - name: Acquire the locked dependency closure before offline execution
        run: cargo fetch --locked

      - name: Require the source bytes the tracking result binds
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Run the AArch64 partial lifecycle tracking probe
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/semaprax-doctor-aarch64-target
        run: bash scripts/doctor-provisioned-linux-aarch64-local-lifecycle.sh

      - name: Preserve the explicit non-promotion boundary
        run: |
          set -euo pipefail
          printf '%s\n' \
            'This dispatch is a 24-case AArch64 tracking probe, not the full 26-case signed-release gate.' \
            'A result does not resolve the two real-distribution exclusions or promote WP-05.'

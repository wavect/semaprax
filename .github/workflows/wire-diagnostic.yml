name: Desktop MSVC toolchain diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Capture native compiler, linker, and SDK identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json)[0]
          $msvc = Join-Path $visualStudio.installationPath 'VC/Tools/MSVC'
          $default = (Get-Content -Raw (Join-Path $visualStudio.installationPath 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt')).Trim()
          $versions = @(Get-ChildItem -LiteralPath $msvc -Directory | ForEach-Object {
            $link = Join-Path $_.FullName 'bin/Hostx64/x64/link.exe'
            if (Test-Path -LiteralPath $link -PathType Leaf) {
              $linkInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($link)
              $banner = (& $link '/?' | Select-Object -First 1).Trim()
              $toolset = $_.Name
              $libraries = @(Get-ChildItem -LiteralPath (Join-Path $_.FullName 'lib/x64') -File |
                Where-Object Name -in 'libcmt.lib', 'libvcruntime.lib', 'libucrt.lib', 'oldnames.lib' |
                ForEach-Object { @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash } })
              @{ toolset = $toolset; link = $linkInfo.FileVersion; banner = $banner; libraries = $libraries }
            }
          })
          $kits = Get-ItemPropertyValue -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10
          $kitLibraries = @(Get-ChildItem -Path (Join-Path $kits 'Lib/10.0.26100.0/*/x64/*.lib') -File |
            Where-Object Name -in 'libucrt.lib', 'ucrt.lib', 'kernel32.lib', 'user32.lib', 'oleacc.lib', 'ole32.lib', 'oleaut32.lib', 'shell32.lib', 'uuid.lib', 'bcrypt.lib' |
            ForEach-Object { @{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash } })
          @{ image = $env:ImageVersion; vswhere = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($vswhere).FileVersion; visual_studio = $visualStudio.installationVersion; default = $default; toolsets = $versions; sdk_libraries = $kitLibraries } | ConvertTo-Json -Depth 9

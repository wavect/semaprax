name: Windows fixed codec diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Enable long evidence paths
        shell: bash
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          lfs: false
      - run: python3 -B scripts/windows-loader-diagnostic.py

[package]
name = "semaprax"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
default-run = "semaprax"
description = "The agent-native systems programming language"
license = "Apache-2.0"
repository = "https://github.com/wavect/semaprax"
homepage = "https://wavect.io/semaprax/"
readme = "README.md"
keywords = ["compiler", "agents", "systems-programming", "semantic-graph"]
categories = ["compilers", "development-tools"]

[workspace]
members = [
    "crates/semaprax-native-host",
    "crates/semaprax-native-loader",
    "crates/semaprax-native-rust-interop-platform",
    "crates/semaprax-native-rust-interop-platform-sys",
    "crates/semaprax-native-rust-owned-data-package",
    "crates/semaprax-native-rust-interop-builder",
]
default-members = ["."]
resolver = "2"

[lib]
name = "semaprax"
path = "src/lib.rs"

[dependencies]
hmac = "=0.13.0"
same-file = "=1.0.6"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
wasmparser = { version = "=0.256.0", default-features = false, features = ["component-model", "features", "validate"] }

[dev-dependencies]

[features]
default = []
unstable-native-host-internal = []
unstable-wit-component-harness = []

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
fs2 = "=0.4.3"
getrandom = "=0.4.3"
semaprax-native-rust-owned-data-package = { version = "=0.1.0", path = "crates/semaprax-native-rust-owned-data-package" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
renamore = { version = "=0.3.2", default-features = false, features = ["always-supported"] }
winapi-util = "=0.1.11"

[[bin]]
name = "semaprax"
path = "src/main.rs"

[[bin]]
name = "semapraxd"
path = "src/bin/semapraxd.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[package]
name = "semaprax"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "The agent-native systems programming language"
license = "Apache-2.0"
repository = "https://github.com/wavect/semaprax"
readme = "README.md"
keywords = ["compiler", "agents", "systems-programming", "semantic-graph"]
categories = ["compilers", "development-tools"]

[workspace]
members = ["crates/semaprax-native-host", "crates/semaprax-native-loader"]
default-members = ["."]
resolver = "2"

[lib]
name = "semaprax"
path = "src/lib.rs"

[dependencies]
hmac = "=0.12.1"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wasmparser = { version = "=0.255.0", default-features = false, features = ["component-model", "features", "validate"] }

[dev-dependencies]

[features]
default = []
unstable-native-host-internal = []
unstable-wit-component-harness = []

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
fs2 = "=0.4.3"
getrandom = "=0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
same-file = "=1.0.6"
winapi-util = "=0.1.11"

[[bin]]
name = "semaprax"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

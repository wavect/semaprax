[package]
name = "semaprax-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Private SEMAPRAX development-harness provider host (docs/HARNESS-PROVIDER-V1.md)"
license = "Apache-2.0"

[dependencies]
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["process", "std"] }

[[bin]]
name = "semaprax-harness"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[package]
name = "semaprax-native-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Thread-confined physical native ownership host for SEMAPRAX"
license = "Apache-2.0"
repository = "https://github.com/wavect/semaprax"

[features]
default = []
unstable-android-emulator-harness = []
unstable-android-jni-harness = []
unstable-apple-swift-harness = []
unstable-desktop-app-harness = []
unstable-ios-simulator-harness = []

[dependencies]
semaprax = { path = "../..", version = "0.3.0", features = ["unstable-native-host-internal"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "windows", target_os = "ios"))'.dependencies]
getrandom = "=0.4.3"
semaprax-native-loader = { path = "../semaprax-native-loader", version = "0.1.0" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "private-android-emulator-v3-fixture"
path = "src/bin/private_android_emulator_v3_fixture.rs"
required-features = ["unstable-android-emulator-harness"]

[[bin]]
name = "private-android-jni-v3-fixture"
path = "src/bin/private_android_jni_v3_fixture.rs"
required-features = ["unstable-android-jni-harness"]

[[bin]]
name = "private-apple-swift-v1-fixture"
path = "src/bin/private_apple_swift_v1_fixture.rs"
required-features = ["unstable-apple-swift-harness"]

[[bin]]
name = "private-ios-simulator-v3-fixture"
path = "src/bin/private_ios_simulator_v3_fixture.rs"
required-features = ["unstable-ios-simulator-harness"]

[[bin]]
name = "private-desktop-v3-fixture"
path = "src/bin/private_desktop_v3_fixture.rs"
required-features = ["unstable-desktop-app-harness"]

[[bin]]
name = "private-desktop-v3-app"
path = "src/bin/private_desktop_v3_app.rs"
required-features = ["unstable-desktop-app-harness"]

[[bin]]
name = "private-desktop-macho-uuid"
path = "src/bin/private_desktop_macho_uuid.rs"
required-features = ["unstable-desktop-app-harness"]

[[bin]]
name = "private-c-consumer-v1-fixture"
path = "src/bin/private_c_consumer_v1_fixture.rs"

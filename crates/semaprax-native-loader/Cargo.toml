[package]
name = "semaprax-native-loader"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Quarantined native module loading for SEMAPRAX hosts"
license = "Apache-2.0"
repository = "https://github.com/wavect/semaprax"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "windows"))'.dependencies]
libloading = "=0.8.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package]
name = "semaprax-native-rust-interop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Bounded Native Rust SDK builder for SEMAPRAX"
license = "Apache-2.0"

[dependencies]
semaprax = { version = "=0.3.5", path = "../..", default-features = false }
semaprax-native-rust-interop-platform = { version = "=0.1.0", path = "../semaprax-native-rust-interop-platform" }
semaprax-native-rust-owned-data-package = { version = "=0.1.0", path = "../semaprax-native-rust-owned-data-package" }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[[bin]]
name = "semaprax-native-rust-sdk"
path = "src/bin/semaprax-native-rust-sdk.rs"

[lints.rust]
unsafe_code = "forbid"

[package]
name = "semaprax-native-rust-interop-platform-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Audited OS quarantine for private SEMAPRAX Native Rust Interop builds"
license = "Apache-2.0"

[[bin]]
name = "semaprax-doctor-worker"
path = "src/bin/doctor_worker.rs"

[[bin]]
name = "semaprax-doctor-launcher"
path = "src/bin/doctor_launcher.rs"

[[bin]]
name = "semaprax-doctor-provisioner"
path = "src/bin/doctor_provisioner.rs"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
sha2 = "=0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
semaprax-doctor-capsule = { version = "=0.1.0", path = "../semaprax-doctor-capsule" }

[target.'cfg(windows)'.dependencies]
sha2 = "=0.11.0"
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

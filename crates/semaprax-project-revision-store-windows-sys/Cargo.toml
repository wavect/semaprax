[package]
name = "semaprax-project-revision-store-windows-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Audited Windows authority quarantine for the SEMAPRAX Project Revision Store"
license = "Apache-2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

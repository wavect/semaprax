[package]
name = "semaprax-rust-api-index"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Bounded replay and admission of compiler-resolved Rust API indexes for SEMAPRAX"
license = "Apache-2.0"

[dependencies]
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
regex = "=1.13.1"
regex_alias = { package = "regex", version = "=1.13.1" }

[lints.rust]
unsafe_code = "forbid"

[package]
name = "semaprax-toolchain"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Private SEMAPRAX full-toolchain CLI and host adapters"
license = "Apache-2.0"

[dependencies]
semaprax = { version = "=0.6.0", path = "../.." }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
same-file = "=1.0.6"
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
sigstore-verify = { version = "=0.11.0", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
semaprax-native-rust-owned-data-package = { version = "=0.1.0", path = "../semaprax-native-rust-owned-data-package" }
semaprax-native-rust-interop-platform = { version = "=0.1.0", path = "../semaprax-native-rust-interop-platform" }
semaprax-native-rust-interop = { version = "=0.1.0", path = "../semaprax-native-rust-interop-builder" }

[target.'cfg(windows)'.dependencies]
semaprax-project-revision-store-windows-sys = { version = "=0.1.0", path = "../semaprax-project-revision-store-windows-sys" }
winapi-util = "=0.1.11"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std", "stdio"] }

[[bin]]
name = "semaprax-full"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

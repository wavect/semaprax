schema = "semaprax.manifest.v1"

[package]
name = "catalog-scoped-record-successor"
version = "0.1.0"
profile = "language-command-io.collection-record.v1"

[modules]
entry = "catalog.app"
sources = ["src/app.spx", "src/model.spx", "src/order.spx", "src/publication.spx", "src/request.spx", "src/response.spx", "src/restock.spx", "src/tests.spx"]
tests = ["catalog.tests"]

[exports]
web = ["catalog.command"]

[command]
function = "catalog.command"
input = "argv-utf8+stdin-stream.v1"

[capabilities]
required = ["process.args.read", "process.stderr.write", "process.stdin.read", "process.stdout.write"]

[dependencies]
std.data.json.digits = "=0.1.0"
std.data.json.query = "=0.1.0"
std.data.json.scan = "=0.1.0"
std.data.json.token = "=0.1.0"
std.data.json.write = "=0.1.0"
std.text = "=0.1.0"

[targets]
matrix = ["native64"]

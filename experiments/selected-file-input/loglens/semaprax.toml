schema = "semaprax.manifest.v1"

[package]
name = "loglens"
version = "0.1.0"
profile = "source-command.selected-file.resource-output.v1"

[modules]
entry = "loglens"
sources = ["loglens.spx", "unit.spx"]
tests = ["loglens.tests"]

[exports]
web = []

[command]
function = "loglens.main"
input = "argv-utf8-256+selected-file.follow.v1"

[capabilities]
required = ["fs.read", "process.args.read", "process.stderr.write", "process.stdout.write"]

[dependencies]
std.int.decimal = "=0.1.0"

[targets]
matrix = ["native64"]

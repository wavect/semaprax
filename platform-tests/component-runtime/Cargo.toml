[package]
name = "semaprax-private-component-runtime-v3"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# This evidence runner is deliberately isolated from the root workspace. Its
# maintained-engine dependency must not change SEMAPRAX's MSRV or publish graph.
[workspace]
resolver = "2"

[dependencies]
semaprax = { version = "=0.3.5", path = "../..", default-features = false, features = ["unstable-wit-component-harness"] }
sha2 = { version = "=0.11.0", default-features = false }
wasmtime = { version = "=47.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

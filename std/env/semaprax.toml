schema = "semaprax.manifest.v1"

[package]
name = "std-env"
version = "0.1.0"
profile = "environment-io.v1"

[modules]
entry = "std.env.examples"
sources = ["src/env.spx", "src/examples.spx", "src/tests.spx"]
tests = ["std.env.tests"]

[exports]
web = []

[command]
function = "std.env.examples.inspect"

[capabilities]
required = ["process.environment.read"]

[dependencies]
std.format = "=0.1.0"
std.io = "=0.1.0"

schema = "semaprax.manifest.v1"

[package]
name = "std-process"
version = "0.1.0"
profile = "process-io.v1"

[modules]
entry = "std.process.examples"
sources = ["src/examples.spx", "src/process.spx", "src/tests.spx"]
tests = ["std.process.tests"]

[exports]
web = []

[command]
function = "std.process.examples.inspect"

[capabilities]
required = ["process.execute"]

[dependencies]
std.io = "=0.1.0"
